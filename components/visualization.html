<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizations — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/dataviz.css">
  <script src="../assets/js/chart.min.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* ============================================================
       Viz Card Shell
    ============================================================ */
    .viz-card {
      background: var(--bg-primary);
      border-radius: 24px;
      padding: 24px;
      border: 1px solid var(--border-subtle);
    }

    .viz-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    .viz-card__title {
      font-size: var(--font-size-lg);   /* 18px */
      font-weight: var(--font-weight-normal);
      color: var(--text-primary);
      margin: 0;
      line-height: 1.25;
    }

    .viz-card__subtitle {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-normal);
      color: var(--text-secondary);
      margin: 3px 0 0;
    }

    .viz-card__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      color: var(--text-tertiary);
    }

    .viz-card__actions [data-icon] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .viz-card__actions [data-icon]:hover { color: var(--text-primary); }

    /* ---- Canvas wrapper ---- */
    .chart-wrap {
      position: relative;
    }

    /* ============================================================
       Tabs (for horizontal-with-tabs chart)
    ============================================================ */
    .viz-tabs {
      display: inline-flex;
      align-items: center;
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 4px;
      gap: 2px;
      margin-bottom: 20px;
    }

    .viz-tab {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border: none;
      border-radius: 12px;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: var(--font-weight-semibold);
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .viz-tab--active {
      background: var(--bg-primary);
      color: var(--text-primary);
      box-shadow: 0 1px 6px -4px black, 0 1px 1px -1px rgba(0,0,0,0.12);
    }

    /* ============================================================
       Showcase layout
    ============================================================ */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }
    .showcase {
      max-width: 1160px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
    }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .viz-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-8);
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- ============================================================
         Row 1: Single Column + Grouped Column
    ============================================================ -->
    <p class="section-title">Column Charts</p>
    <div class="viz-grid-2">

      <!-- Single Bar -->
      <div class="viz-card">
        <div class="viz-card__header">
          <div>
            <p class="viz-card__title">Incident volume by priority</p>
          </div>
          <div class="viz-card__actions">
            <span data-icon="filter"></span>
            <span data-icon="refresh"></span>
            <span data-icon="more-horizontal"></span>
          </div>
        </div>
        <div class="chart-wrap" style="height: 220px;">
          <canvas id="chart-single-bar"></canvas>
        </div>
      </div>

      <!-- Grouped Column -->
      <div class="viz-card">
        <div class="viz-card__header">
          <div>
            <p class="viz-card__title">Employee performance</p>
          </div>
          <div class="viz-card__actions">
            <span data-icon="filter"></span>
            <span data-icon="refresh"></span>
            <span data-icon="more-horizontal"></span>
          </div>
        </div>
        <div class="chart-wrap" style="height: 260px;">
          <canvas id="chart-grouped"></canvas>
        </div>
      </div>

    </div>

    <!-- ============================================================
         Row 2: Stacked Column + Single Horizontal
    ============================================================ -->
    <div class="viz-grid-2">

      <!-- Stacked Column -->
      <div class="viz-card">
        <div class="viz-card__header">
          <div>
            <p class="viz-card__title">Running costs by region</p>
          </div>
          <div class="viz-card__actions">
            <span data-icon="filter"></span>
            <span data-icon="refresh"></span>
            <span data-icon="more-horizontal"></span>
          </div>
        </div>
        <div class="chart-wrap" style="height: 260px;">
          <canvas id="chart-stacked-col"></canvas>
        </div>
      </div>

      <!-- Single Horizontal -->
      <div class="viz-card">
        <div class="viz-card__header">
          <div>
            <p class="viz-card__title">Open tasks by assignee</p>
          </div>
          <div class="viz-card__actions">
            <span data-icon="filter"></span>
            <span data-icon="refresh"></span>
            <span data-icon="more-horizontal"></span>
          </div>
        </div>
        <div class="chart-wrap" style="height: 220px;">
          <canvas id="chart-single-h"></canvas>
        </div>
      </div>

    </div>

    <!-- ============================================================
         Row 3: Stacked Horizontal (full width)
    ============================================================ -->
    <p class="section-title">Horizontal Bar Charts</p>
    <div class="viz-card">
      <div class="viz-card__header">
        <div>
          <p class="viz-card__title">Product performance</p>
        </div>
        <div class="viz-card__actions">
          <span data-icon="filter"></span>
          <span data-icon="refresh"></span>
          <span data-icon="more-horizontal"></span>
        </div>
      </div>
      <div class="chart-wrap" style="height: 300px;">
        <canvas id="chart-stacked-h"></canvas>
      </div>
    </div>

    <!-- ============================================================
         Row 4: Horizontal with Tabs (full width)
    ============================================================ -->
    <div class="viz-card">
      <div class="viz-card__header">
        <div>
          <p class="viz-card__title">Creator calls breakdown</p>
          <p class="viz-card__subtitle">Support interactions by role</p>
        </div>
        <div class="viz-card__actions">
          <span data-icon="filter"></span>
          <span data-icon="refresh"></span>
          <span data-icon="more-horizontal"></span>
        </div>
      </div>
      <div class="viz-tabs" id="tab-group">
        <button class="viz-tab viz-tab--active" data-tab="weekly">Weekly</button>
        <button class="viz-tab" data-tab="monthly">Monthly</button>
        <button class="viz-tab" data-tab="quarterly">Quarterly</button>
      </div>
      <div class="chart-wrap" style="height: 220px;">
        <canvas id="chart-h-tabs"></canvas>
      </div>
    </div>

    <!-- ============================================================
         Row 5: Pareto (full width)
    ============================================================ -->
    <p class="section-title">Pareto Chart</p>
    <div class="viz-card">
      <div class="viz-card__header">
        <div>
          <p class="viz-card__title">Incident submissions</p>
        </div>
        <div class="viz-card__actions">
          <span data-icon="filter"></span>
          <span data-icon="refresh"></span>
          <span data-icon="more-horizontal"></span>
        </div>
      </div>
      <div class="chart-wrap" style="height: 340px;">
        <canvas id="chart-pareto"></canvas>
      </div>
    </div>

  </div><!-- /.showcase -->

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    Horizon.initIcons();

    // ============================================================
    //  Shared tokens (read from CSS custom properties)
    // ============================================================
    const root = document.documentElement;
    const dvColor = (n) => getComputedStyle(root).getPropertyValue(`--dv-color-${n}`).trim();

    const C = {
      blue:       '#0669FF',  // dv-color-8
      lightBlue:  '#099FDB',  // dv-color-7
      purple:     '#7857FF',  // dv-color-9
      fuchsia:    '#EF3EFF',  // dv-color-5
      green:      '#008A01',  // dv-color-1
      orange:     '#EA7117',  // dv-color-3
      axisColor:  '#656462',
      gridColor:  '#BABABB',
      tooltipBg:  '#1E293B',
    };

    const AXIS_FONT = { family: "'ServiceNow Sans', -apple-system, sans-serif", size: 12, weight: '300' };
    const LEGEND_FONT = { family: "'ServiceNow Sans', -apple-system, sans-serif", size: 10 };

    // ============================================================
    //  Global Chart.js defaults
    // ============================================================
    Chart.defaults.font.family = "'ServiceNow Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
    Chart.defaults.color = C.axisColor;
    Chart.defaults.plugins.tooltip.backgroundColor = C.tooltipBg;
    Chart.defaults.plugins.tooltip.titleColor = '#ffffff';
    Chart.defaults.plugins.tooltip.bodyColor = '#c2c1bf';
    Chart.defaults.plugins.tooltip.padding = { x: 12, y: 8 };
    Chart.defaults.plugins.tooltip.cornerRadius = 8;
    Chart.defaults.plugins.tooltip.caretSize = 4;
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.pointStyle = 'circle';
    Chart.defaults.plugins.legend.labels.font = LEGEND_FONT;
    Chart.defaults.plugins.legend.labels.boxWidth = 8;
    Chart.defaults.plugins.legend.labels.boxHeight = 8;
    Chart.defaults.plugins.legend.labels.padding = 16;

    // ============================================================
    //  Custom plugin: dashed grid lines + solid baseline
    // ============================================================
    const horizonGrid = {
      id: 'horizonGrid',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea) return;

        const isH = chart.config.options?.indexAxis === 'y';
        const valueScale = isH ? scales.x : scales.y;
        if (!valueScale) return;

        const { top, bottom, left, right } = chartArea;

        ctx.save();
        valueScale.ticks.forEach((tick, i) => {
          const pos = valueScale.getPixelForTick(i);
          const isZero = tick.value === 0;
          ctx.beginPath();
          ctx.setLineDash(isZero ? [] : [4, 4]);
          ctx.strokeStyle = isZero ? 'rgba(0,0,0,0.15)' : C.gridColor;
          ctx.lineWidth = 1;
          if (isH) {
            ctx.moveTo(pos, top);
            ctx.lineTo(pos, bottom);
          } else {
            ctx.moveTo(left, pos);
            ctx.lineTo(right, pos);
          }
          ctx.stroke();
        });
        ctx.restore();
      }
    };

    // ============================================================
    //  Custom plugin: value labels above vertical bars
    // ============================================================
    const valueLabels = {
      id: 'valueLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        chart.data.datasets.forEach((ds, di) => {
          if (!ds._showLabels) return;
          const meta = chart.getDatasetMeta(di);
          if (meta.hidden) return;
          meta.data.forEach((bar, idx) => {
            const val = ds.data[idx];
            if (val == null) return;
            const { x, y } = bar;
            ctx.save();
            ctx.fillStyle = '#4d4c4a';
            ctx.font = '12px "ServiceNow Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(val, x, y - 5);
            ctx.restore();
          });
        });
      }
    };

    Chart.register(horizonGrid, valueLabels);

    // ============================================================
    //  Shared scale configs
    // ============================================================
    function yScale(opts = {}) {
      return {
        grid: { display: false },
        border: { display: false },
        ticks: { color: C.axisColor, font: AXIS_FONT, padding: 6 },
        ...opts
      };
    }

    function xScale(opts = {}) {
      return {
        grid: { display: false },
        border: { display: false },
        ticks: { color: C.axisColor, font: AXIS_FONT, padding: 6 },
        ...opts
      };
    }

    const legendBottom = {
      display: true,
      position: 'bottom',
      align: 'center',
      labels: { padding: 16 }
    };

    // ============================================================
    //  1. Single Bar — Incident volume by priority
    // ============================================================
    new Chart(document.getElementById('chart-single-bar'), {
      type: 'bar',
      data: {
        labels: ['P1', 'P2', 'P3', 'P4'],
        datasets: [{
          data: [45, 72, 38, 28],
          backgroundColor: [C.blue, C.green, C.fuchsia, C.purple],
          borderRadius: 6,
          borderSkipped: 'bottom',
          barThickness: 52,
          _showLabels: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 24 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => 'Priority ' + items[0].label,
              label: (item) => ' ' + item.formattedValue + ' incidents'
            }
          }
        },
        scales: {
          x: xScale(),
          y: { display: false, grid: { display: false } }
        }
      }
    });

    // ============================================================
    //  2. Grouped Column — Employee performance
    // ============================================================
    new Chart(document.getElementById('chart-grouped'), {
      type: 'bar',
      data: {
        labels: ['May', 'Jun', 'Jul', 'Aug', 'Sep'],
        datasets: [
          {
            label: 'IT',
            data: [65, 45, 72, 55, 80],
            backgroundColor: C.lightBlue,
            borderRadius: 6,
            borderSkipped: 'bottom',
            maxBarThickness: 20,
            barPercentage: 0.9,
            categoryPercentage: 0.85,
          },
          {
            label: 'Sales',
            data: [80, 60, 45, 70, 55],
            backgroundColor: C.blue,
            borderRadius: 6,
            borderSkipped: 'bottom',
            maxBarThickness: 20,
            barPercentage: 0.9,
            categoryPercentage: 0.85,
          },
          {
            label: 'Dev',
            data: [45, 75, 60, 85, 65],
            backgroundColor: C.purple,
            borderRadius: 6,
            borderSkipped: 'bottom',
            maxBarThickness: 20,
            barPercentage: 0.9,
            categoryPercentage: 0.85,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: legendBottom },
        scales: {
          x: xScale(),
          y: yScale({ min: 0, max: 100, ticks: { stepSize: 20, ...{ color: C.axisColor, font: AXIS_FONT, padding: 6 } } })
        }
      }
    });

    // ============================================================
    //  3. Stacked Column — Running costs by region
    // ============================================================
    new Chart(document.getElementById('chart-stacked-col'), {
      type: 'bar',
      data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'],
        datasets: [
          {
            label: 'APAC',
            data: [22, 18, 25, 20, 28, 15, 22, 30, 18, 24],
            backgroundColor: C.blue,
            borderRadius: 0,
            borderSkipped: false,
            borderWidth: 1,
            borderColor: '#ffffff',
            stack: 'costs',
          },
          {
            label: 'AMS',
            data: [30, 25, 28, 32, 20, 35, 28, 22, 30, 26],
            backgroundColor: C.fuchsia,
            borderRadius: 0,
            borderSkipped: false,
            borderWidth: 1,
            borderColor: '#ffffff',
            stack: 'costs',
          },
          {
            label: 'AMA',
            data: [35, 40, 30, 28, 38, 32, 35, 28, 40, 35],
            backgroundColor: C.purple,
            borderRadius: 6,
            borderSkipped: 'bottom',
            borderWidth: 1,
            borderColor: '#ffffff',
            stack: 'costs',
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: legendBottom },
        scales: {
          x: xScale({ stacked: true }),
          y: yScale({
            stacked: true,
            min: 0,
            max: 100,
            ticks: { stepSize: 20, color: C.axisColor, font: AXIS_FONT, padding: 6 }
          })
        }
      }
    });

    // ============================================================
    //  4. Single Horizontal — Open tasks by assignee
    // ============================================================
    new Chart(document.getElementById('chart-single-h'), {
      type: 'bar',
      data: {
        labels: ['Alice Johnson', 'Bob Martinez', 'Carol Chen', 'David Park', 'Eve Williams'],
        datasets: [{
          data: [85, 60, 45, 72, 38],
          backgroundColor: C.blue,
          borderRadius: 6,
          borderSkipped: 'left',
          barThickness: 24,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 8 } },
        plugins: { legend: { display: false } },
        scales: {
          x: xScale({ min: 0, max: 120, ticks: { stepSize: 20, color: C.axisColor, font: AXIS_FONT } }),
          y: yScale({ ticks: { color: C.axisColor, font: AXIS_FONT, align: 'center' } })
        }
      }
    });

    // ============================================================
    //  5. Stacked Horizontal — Product performance
    // ============================================================
    new Chart(document.getElementById('chart-stacked-h'), {
      type: 'bar',
      data: {
        labels: ['Product A','Product B','Product C','Product D','Product E','Product F'],
        datasets: [
          {
            label: 'APAC',
            data: [520, 380, 650, 410, 590, 310],
            backgroundColor: C.blue,
            borderRadius: 0,
            borderSkipped: false,
            borderWidth: 1,
            borderColor: '#ffffff',
            stack: 'perf',
          },
          {
            label: 'AMS',
            data: [480, 520, 390, 560, 370, 490],
            backgroundColor: C.fuchsia,
            borderRadius: 0,
            borderSkipped: false,
            borderWidth: 1,
            borderColor: '#ffffff',
            stack: 'perf',
          },
          {
            label: 'AMA',
            data: [620, 440, 570, 480, 610, 420],
            backgroundColor: C.purple,
            borderRadius: 6,
            borderSkipped: 'left',
            borderWidth: 1,
            borderColor: '#ffffff',
            stack: 'perf',
          }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: legendBottom },
        scales: {
          x: xScale({
            stacked: true,
            min: 0,
            ticks: { stepSize: 250, color: C.axisColor, font: AXIS_FONT }
          }),
          y: yScale({ stacked: true, ticks: { color: C.axisColor, font: AXIS_FONT } })
        }
      }
    });

    // ============================================================
    //  6. Single Horizontal with Tabs — Creator calls breakdown
    // ============================================================
    const tabDatasets = {
      weekly: {
        labels: ['Director', 'Manager', 'Lead', 'Engineer', 'Analyst', 'Intern'],
        data:   [92, 78, 65, 54, 40, 22]
      },
      monthly: {
        labels: ['Director', 'Manager', 'Lead', 'Engineer', 'Analyst', 'Intern'],
        data:   [380, 290, 245, 200, 155, 85]
      },
      quarterly: {
        labels: ['Director', 'Manager', 'Lead', 'Engineer', 'Analyst', 'Intern'],
        data:   [1140, 870, 735, 600, 465, 255]
      }
    };

    const tabChart = new Chart(document.getElementById('chart-h-tabs'), {
      type: 'bar',
      data: {
        labels: tabDatasets.weekly.labels,
        datasets: [{
          data: tabDatasets.weekly.data,
          backgroundColor: C.blue,
          borderRadius: 6,
          borderSkipped: 'left',
          barThickness: 24,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 8 } },
        plugins: { legend: { display: false } },
        scales: {
          x: xScale({ min: 0, ticks: { color: C.axisColor, font: AXIS_FONT } }),
          y: yScale({ ticks: { color: C.axisColor, font: AXIS_FONT } })
        }
      }
    });

    // Tab switching
    document.getElementById('tab-group').addEventListener('click', (e) => {
      const btn = e.target.closest('.viz-tab');
      if (!btn) return;
      const tab = btn.dataset.tab;
      document.querySelectorAll('#tab-group .viz-tab').forEach(t => t.classList.remove('viz-tab--active'));
      btn.classList.add('viz-tab--active');
      const d = tabDatasets[tab];
      tabChart.data.labels = d.labels;
      tabChart.data.datasets[0].data = d.data;
      tabChart.update();
    });

    // ============================================================
    //  7. Pareto — Incident submissions
    // ============================================================
    const paretoRaw = [52, 48, 35, 28, 21, 16];
    const paretoTotal = paretoRaw.reduce((a, b) => a + b, 0);
    let cumSum = 0;
    const paretoCumulative = paretoRaw.map(v => {
      cumSum += v;
      return Math.round((cumSum / paretoTotal) * 100);
    });

    new Chart(document.getElementById('chart-pareto'), {
      type: 'bar',
      data: {
        labels: ['Website crashes', 'Bugs reported', 'Confusing UI', 'Error messages', 'Filtering issues', 'Not user friendly'],
        datasets: [
          {
            type: 'bar',
            label: 'Submissions',
            data: paretoRaw,
            backgroundColor: C.lightBlue,
            borderRadius: 6,
            borderSkipped: 'bottom',
            barThickness: 80,
            yAxisID: 'y',
            order: 2,
          },
          {
            type: 'line',
            label: 'Cumulative %',
            data: paretoCumulative,
            borderColor: '#333333',
            backgroundColor: 'transparent',
            pointBackgroundColor: '#333333',
            pointBorderColor: '#ffffff',
            pointBorderWidth: 1.5,
            pointRadius: 5,
            tension: 0.35,
            borderWidth: 2,
            yAxisID: 'y2',
            order: 1,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8 } },
        plugins: {
          legend: {
            ...legendBottom,
            labels: {
              usePointStyle: true,
              pointStyle: 'circle',
              font: LEGEND_FONT,
              padding: 16,
              generateLabels(chart) {
                return chart.data.datasets.map((ds, i) => ({
                  text: ds.label,
                  fillStyle: i === 0 ? C.lightBlue : '#333333',
                  strokeStyle: i === 0 ? C.lightBlue : '#333333',
                  pointStyle: 'circle',
                  hidden: false,
                  datasetIndex: i,
                }));
              }
            }
          }
        },
        scales: {
          x: xScale({
            ticks: {
              maxRotation: 0,
              color: C.axisColor,
              font: AXIS_FONT,
            }
          }),
          y: yScale({
            min: 0,
            max: Math.ceil(paretoTotal / 10) * 10 + 10,
            position: 'left',
            ticks: { stepSize: 10, color: C.axisColor, font: AXIS_FONT, padding: 6 },
            title: {
              display: true,
              text: 'Number of incidents',
              color: C.axisColor,
              font: { family: "'ServiceNow Sans', sans-serif", size: 10 },
              padding: { bottom: 8 }
            }
          }),
          y2: {
            min: 0,
            max: 100,
            position: 'right',
            grid: { display: false },
            border: { display: false },
            ticks: {
              stepSize: 20,
              color: C.axisColor,
              font: AXIS_FONT,
              padding: 6,
              callback: v => v + '%'
            }
          }
        }
      }
    });

  }); // DOMContentLoaded
  </script>

</body>
</html>
