<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radial Progress — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Radial Progress
       130px overall, SVG stroke arc approach
       Track: neutral-200, Fill: color-specific
       Center: percentage text (primary color, light weight)
       Stroke width: ~12px (0.9rem equivalent at 130px)
       8 color variants matching progress bar
    -------------------------------------------------------- */

    .radial {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .radial__svg-wrap {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .radial__svg {
      width: 130px;
      height: 130px;
      transform: rotate(-90deg);
    }

    .radial__track {
      fill: none;
      stroke: var(--color-neutral-200, #edece9);
      stroke-width: 12;
    }

    .radial__fill {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
    }

    /* Center label */
    .radial__center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .radial__pct {
      font-family: var(--font-sans);
      font-size: 22px;
      font-weight: var(--font-weight-normal);
      color: var(--color-primary, #0e4e69);
      line-height: 1;
    }

    .radial__sublabel {
      font-family: var(--font-sans);
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* Bottom label */
    .radial__label {
      font-family: var(--font-sans);
      font-size: var(--font-size-xs, 12px);
      color: var(--text-secondary);
      text-align: center;
    }

    /* ---- Color variants ---- */
    .radial__fill--primary  { stroke: var(--color-primary, #0e4e69); }
    .radial__fill--success  { stroke: var(--color-success, #16a34a); }
    .radial__fill--warning  { stroke: var(--color-warning, #d97706); }
    .radial__fill--error    { stroke: var(--color-error, #dc2626); }
    .radial__fill--info     { stroke: var(--color-info, #2563eb); }
    .radial__fill--purple   { stroke: #7c3aed; }
    .radial__fill--orange   { stroke: #ea580c; }
    .radial__fill--teal     { stroke: #0d9488; }

    /* Center text matches fill color */
    .radial--success .radial__pct  { color: var(--color-success, #16a34a); }
    .radial--warning .radial__pct  { color: var(--color-warning, #d97706); }
    .radial--error .radial__pct    { color: var(--color-error, #dc2626); }
    .radial--info .radial__pct     { color: var(--color-info, #2563eb); }
    .radial--purple .radial__pct   { color: #7c3aed; }
    .radial--orange .radial__pct   { color: #ea580c; }
    .radial--teal .radial__pct     { color: #0d9488; }

    /* ---- Sizes ---- */
    .radial--sm .radial__svg-wrap,
    .radial--sm .radial__svg { width: 80px; height: 80px; }
    .radial--sm .radial__pct { font-size: 16px; }

    .radial--lg .radial__svg-wrap,
    .radial--lg .radial__svg { width: 180px; height: 180px; }
    .radial--lg .radial__pct { font-size: 30px; }
    .radial--lg .radial__track,
    .radial--lg .radial__fill { stroke-width: 16; }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }
    .showcase { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
    }

    .demo-row {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: flex-end;
    }

    .demo-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .demo-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- Default size — color variants -->
    <div class="card">
      <p class="section-title">Color Variants (130px)</p>
      <div class="demo-row">

        <div class="demo-col">
          <p class="demo-label">Primary</p>
          <div class="radial" data-radial="72" data-color="primary">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--primary js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">72%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Success</p>
          <div class="radial radial--success" data-radial="85" data-color="success">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--success js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">85%</span>
                <span class="radial__sublabel">SLA Met</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Warning</p>
          <div class="radial radial--warning" data-radial="48" data-color="warning">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--warning js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">48%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Error</p>
          <div class="radial radial--error" data-radial="30" data-color="error">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--error js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">30%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Info</p>
          <div class="radial radial--info" data-radial="60" data-color="info">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--info js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">60%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Purple</p>
          <div class="radial radial--purple" data-radial="55" data-color="purple">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--purple js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">55%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Orange</p>
          <div class="radial radial--orange" data-radial="40" data-color="orange">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--orange js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">40%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Teal</p>
          <div class="radial radial--teal" data-radial="90" data-color="teal">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--teal js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">90%</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Sizes -->
    <div class="card">
      <p class="section-title">Sizes</p>
      <div class="demo-row">
        <div class="demo-col">
          <p class="demo-label">Small (80px)</p>
          <div class="radial radial--sm" data-radial="65" data-color="primary">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 80 80">
                <circle class="radial__track" cx="40" cy="40" r="31"/>
                <circle class="radial__fill radial__fill--primary js-fill" cx="40" cy="40" r="31"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">65%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Default (130px)</p>
          <div class="radial" data-radial="65" data-color="primary">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 130 130">
                <circle class="radial__track" cx="65" cy="65" r="53"/>
                <circle class="radial__fill radial__fill--primary js-fill" cx="65" cy="65" r="53"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">65%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="demo-col">
          <p class="demo-label">Large (180px)</p>
          <div class="radial radial--lg radial--success" data-radial="65" data-color="success">
            <div class="radial__svg-wrap">
              <svg class="radial__svg" viewBox="0 0 180 180">
                <circle class="radial__track" cx="90" cy="90" r="74"/>
                <circle class="radial__fill radial__fill--success js-fill" cx="90" cy="90" r="74"/>
              </svg>
              <div class="radial__center">
                <span class="radial__pct js-pct">65%</span>
                <span class="radial__sublabel">Complete</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Interactive -->
    <div class="card">
      <p class="section-title">Interactive</p>
      <div class="demo-row" style="align-items: center; gap: 32px;">
        <div class="radial" id="interactive-radial" data-radial="65" data-color="primary">
          <div class="radial__svg-wrap">
            <svg class="radial__svg" viewBox="0 0 130 130">
              <circle class="radial__track" cx="65" cy="65" r="53"/>
              <circle class="radial__fill radial__fill--primary js-fill" cx="65" cy="65" r="53" id="int-fill"/>
            </svg>
            <div class="radial__center">
              <span class="radial__pct" id="int-pct">65%</span>
            </div>
          </div>
        </div>
        <div style="flex: 1; max-width: 300px;">
          <input type="range" min="0" max="100" value="65" id="radial-slider"
            style="width: 100%; accent-color: var(--color-primary);">
          <p style="font-size: 12px; color: var(--text-tertiary); margin-top: 8px;">Drag to change value</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Horizon.initIcons();

      // Compute stroke-dasharray and stroke-dashoffset for each radial
      function setRadialProgress(fillEl, pct, r) {
        const circumference = 2 * Math.PI * r;
        fillEl.style.strokeDasharray = circumference;
        fillEl.style.strokeDashoffset = circumference * (1 - pct / 100);
      }

      // Init all radials from data attribute
      document.querySelectorAll('[data-radial]').forEach(el => {
        const pct = parseFloat(el.dataset.radial);
        const fill = el.querySelector('.js-fill');
        if (!fill) return;
        // Determine r from the SVG viewBox
        const cx = parseFloat(fill.getAttribute('cx'));
        const r = parseFloat(fill.getAttribute('r'));
        setRadialProgress(fill, pct, r);
      });

      // Interactive
      const slider = document.getElementById('radial-slider');
      const intFill = document.getElementById('int-fill');
      const intPct = document.getElementById('int-pct');
      if (slider && intFill) {
        const r = parseFloat(intFill.getAttribute('r'));
        slider.addEventListener('input', () => {
          const pct = parseInt(slider.value);
          setRadialProgress(intFill, pct, r);
          intPct.textContent = pct + '%';
        });
      }
    });
  </script>

</body>
</html>
