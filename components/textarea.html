<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textarea — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Textarea input box
       The native <textarea> handles all visual states.
    -------------------------------------------------------- */
    .textarea {
      display: block;
      width: 100%;
      min-height: 76px;
      padding: 12px;
      border-radius: var(--radius-field); /* 12px */
      border: 1px solid var(--border-default);
      background-color: var(--bg-primary);
      font-family: var(--font-sans);
      font-size: var(--font-size-sm); /* 14px */
      font-weight: 300; /* Light */
      color: var(--text-primary);
      line-height: 1.25rem; /* 20px */
      resize: vertical;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast);
      outline: none;
    }

    .textarea::placeholder {
      color: var(--text-tertiary);
      font-weight: 300;
    }

    /* ---- Focused ---- */
    .textarea:focus:not(.textarea--disabled):not(.textarea--view-only):not(.textarea--ghost) {
      box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--border-default);
    }

    /* ---- Error ---- */
    .textarea--error {
      border-color: var(--color-error);
    }

    .textarea--error:focus {
      box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--color-error);
    }

    /* ---- Disabled / View only ---- */
    .textarea--disabled,
    .textarea--view-only {
      background-color: var(--bg-secondary);
      border-color: var(--bg-secondary);
      color: #a3a2a1;
      cursor: not-allowed;
      pointer-events: none;
      resize: none;
    }

    .textarea--disabled::placeholder,
    .textarea--view-only::placeholder {
      color: #a3a2a1;
    }

    /* ---- Ghost (no border, shorter) ---- */
    .textarea--ghost {
      border-color: transparent;
      min-height: 44px;
    }

    .textarea--ghost:focus {
      box-shadow: none;
    }

    /* --------------------------------------------------------
       Textarea Fieldset (assembled)
       Note: gap is 4px (tighter than input-fieldset's 8px)
    -------------------------------------------------------- */
    .textarea-fieldset {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    /* Fieldset legend — same as input-field but label is medium weight */
    .textarea-fieldset .field-legend__label {
      font-weight: var(--font-weight-semibold);
    }

    .textarea-fieldset__help {
      font-family: var(--font-sans);
      font-size: 0.625rem; /* 10px */
      line-height: 1rem; /* 16px */
      color: var(--text-tertiary);
    }

    .textarea-fieldset__help--error {
      color: var(--color-error);
    }

    /* --------------------------------------------------------
       Fieldset Legend (shared with input-field, repeated here
       so this file is self-contained)
    -------------------------------------------------------- */
    .field-legend {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field-legend__title {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .field-legend__required {
      font-size: var(--font-size-xs);
      color: var(--color-error);
      line-height: var(--line-height-5);
    }

    .field-legend__label {
      font-family: var(--font-sans);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold); /* medium/semibold for textarea */
      color: var(--text-primary);
      line-height: var(--line-height-5);
    }

    .field-legend__optional {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      line-height: var(--line-height-5);
    }

    .field-legend__info {
      color: var(--text-tertiary);
      width: 12px;
      height: 12px;
      cursor: pointer;
    }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }
    .showcase { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-6);
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .state-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- Textarea input box — all states -->
    <div class="card">
      <p class="section-title">Textarea Input Box — States</p>
      <div class="grid">

        <div class="col">
          <span class="state-label">Default</span>
          <textarea class="textarea" placeholder="Input text"></textarea>
        </div>

        <div class="col">
          <span class="state-label">Focused</span>
          <!-- Simulated focus ring -->
          <textarea class="textarea" style="box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--border-default);">Input text</textarea>
        </div>

        <div class="col">
          <span class="state-label">Disabled</span>
          <textarea class="textarea textarea--disabled" placeholder="Input text" disabled></textarea>
        </div>

        <div class="col">
          <span class="state-label">View Only</span>
          <textarea class="textarea textarea--view-only" readonly>Input text</textarea>
        </div>

        <div class="col">
          <span class="state-label">Error</span>
          <textarea class="textarea textarea--error">Input text</textarea>
        </div>

        <div class="col">
          <span class="state-label">Error Focused</span>
          <textarea class="textarea textarea--error" style="box-shadow: 0 0 0 2px var(--bg-primary), 0 0 0 4px var(--color-error);">Input text</textarea>
        </div>

        <div class="col">
          <span class="state-label">Ghost</span>
          <textarea class="textarea textarea--ghost" placeholder="Input text"></textarea>
        </div>

      </div>
    </div>

    <!-- Assembled fieldsets -->
    <div class="card">
      <p class="section-title">Textarea Fieldset — Assembled</p>
      <div class="grid">

        <div class="col">
          <span class="state-label">Default</span>
          <div class="textarea-fieldset">
            <div class="field-legend">
              <div class="field-legend__title">
                <label class="field-legend__label" for="ta-default">Title</label>
                <span data-icon="circle-info" class="field-legend__info"></span>
              </div>
            </div>
            <textarea id="ta-default" class="textarea" placeholder="Input text"></textarea>
          </div>
        </div>

        <div class="col">
          <span class="state-label">With help text</span>
          <div class="textarea-fieldset">
            <div class="field-legend">
              <div class="field-legend__title">
                <label class="field-legend__label" for="ta-help">Your bio</label>
                <span data-icon="circle-info" class="field-legend__info"></span>
              </div>
            </div>
            <textarea id="ta-help" class="textarea" placeholder="Tell us about yourself…"></textarea>
            <p class="textarea-fieldset__help">Maximum 500 characters</p>
          </div>
        </div>

        <div class="col">
          <span class="state-label">Required + Error</span>
          <div class="textarea-fieldset">
            <div class="field-legend">
              <div class="field-legend__title">
                <span class="field-legend__required">*</span>
                <label class="field-legend__label" for="ta-error">Description</label>
              </div>
            </div>
            <textarea id="ta-error" class="textarea textarea--error">Too short</textarea>
            <p class="textarea-fieldset__help textarea-fieldset__help--error">Description must be at least 20 characters</p>
          </div>
        </div>

        <div class="col">
          <span class="state-label">Optional</span>
          <div class="textarea-fieldset">
            <div class="field-legend">
              <div class="field-legend__title">
                <label class="field-legend__label" for="ta-optional">Notes</label>
                <span class="field-legend__optional">(optional)</span>
              </div>
            </div>
            <textarea id="ta-optional" class="textarea" placeholder="Any additional notes…"></textarea>
            <p class="textarea-fieldset__help">Help text</p>
          </div>
        </div>

        <div class="col">
          <span class="state-label">Disabled</span>
          <div class="textarea-fieldset">
            <div class="field-legend">
              <div class="field-legend__title">
                <label class="field-legend__label" for="ta-disabled">Summary</label>
              </div>
            </div>
            <textarea id="ta-disabled" class="textarea textarea--disabled" disabled placeholder="Input text"></textarea>
          </div>
        </div>

        <div class="col">
          <span class="state-label">Ghost</span>
          <div class="textarea-fieldset">
            <div class="field-legend">
              <div class="field-legend__title">
                <label class="field-legend__label" for="ta-ghost">Comment</label>
              </div>
            </div>
            <textarea id="ta-ghost" class="textarea textarea--ghost" placeholder="Write a comment…"></textarea>
          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
