<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetings Card — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Copied verbatim from button.html — base + secondary
    -------------------------------------------------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 16px;
      height: 40px;
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      line-height: 1.8;
      white-space: nowrap;
      border: none;
      border-radius: var(--radius-field);
      cursor: pointer;
      text-decoration: none;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }
    .btn-secondary {
      background-color: var(--color-secondary);
      color: var(--color-secondary-content);
    }
    .btn-secondary:hover  { background-color: var(--color-secondary-hover); }
    .btn-secondary:active { background-color: var(--color-secondary-active); }

    /* --------------------------------------------------------
       Copied verbatim from button-iconic.html — base + ghost + xs
    -------------------------------------------------------- */
    .btn-iconic {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: var(--radius-field);
      cursor: pointer;
      transition: background-color var(--transition-fast), opacity var(--transition-fast);
    }
    .btn-iconic:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .btn-iconic.btn-ghost     { background-color: transparent; color: var(--text-primary); }
    .btn-iconic.btn-ghost:hover  { background-color: var(--color-ghost-hover); }
    .btn-iconic.btn-ghost:active { background-color: var(--color-ghost-active); }
    .btn-iconic.btn-xs { width: 24px; height: 24px; border-radius: var(--radius-lg); }
    .btn-iconic.btn-xs [data-icon]     { width: 12px; height: 12px; }
    .btn-iconic.btn-xs [data-icon] svg { width: 12px; height: 12px; display: block; }

    /* --------------------------------------------------------
       Meetings Card
       375px wide. Two orientations: horizontal (fixed 322px tall)
       and vertical (auto height).
    -------------------------------------------------------- */
    .mc-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-box);
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.10), 0 1px 2px 0 rgba(0,0,0,0.10);
      width: 375px;
      display: flex;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Horizontal: date panel left, events right ── */
    .mc-card--horizontal {
      flex-direction: row;
      height: 322px;
    }

    /* ── Vertical: full-width banner on top, events below ── */
    .mc-card--vertical {
      flex-direction: column;
    }

    /* ── Date panel ── */
    .mc-card__date {
      background: var(--bg-inverted);
      display: flex;
      flex-shrink: 0;
    }

    .mc-card--horizontal .mc-card__date {
      width: 140px;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px;
    }

    .mc-card--vertical .mc-card__date {
      width: 100%;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px;
    }

    /* Date top block: month + day */
    .mc-date__top {
      display: flex;
      flex-direction: column;
    }
    .mc-date__month {
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      color: rgba(255, 255, 255, 0.6);
      line-height: 20px;
    }
    .mc-date__day {
      font-family: var(--font-sans);
      font-size: var(--font-size-4xl); /* 36px */
      font-weight: var(--font-weight-normal);
      color: #ffffff;
      line-height: 1.1;
      margin-top: 2px;
    }

    /* Date bottom block: "Today" + event count */
    .mc-date__bottom {
      display: flex;
      flex-direction: column;
    }
    .mc-card--vertical .mc-date__bottom {
      text-align: right;
    }
    .mc-date__label {
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      color: #ffffff;
      line-height: 20px;
    }
    .mc-date__count {
      font-family: var(--font-sans);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-normal);
      color: rgba(255, 255, 255, 0.6);
      line-height: 16px;
    }

    /* ── Body: event list + footer ── */
    .mc-card__body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .mc-card__list {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 0;
      overflow: hidden;
    }

    /* ── Individual event item ── */
    .mc-event {
      display: flex;
      flex-direction: row;
      height: 91px;
      flex-shrink: 0;
    }

    /* Left accent line */
    .mc-event__line {
      width: 3px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      align-self: stretch;
      margin: 10px 0;
    }
    .mc-event__line--active   { background: var(--color-primary); }
    .mc-event__line--inactive { background: var(--border-subtle); }

    /* Event content */
    .mc-event__body {
      flex: 1;
      min-width: 0;
      padding: 8px 0 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mc-event__title {
      font-family: var(--font-sans);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-normal);
      color: var(--text-primary);
      line-height: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mc-event__time {
      font-family: var(--font-sans);
      font-size: var(--font-size-xs);
      font-weight: 300;
      color: var(--text-tertiary);
      line-height: 16px;
    }
    .mc-event__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Avatar group (small, 20px) ── */
    .mc-avatars {
      display: flex;
      align-items: center;
    }
    .mc-avatar {
      width: 20px;
      height: 20px;
      border-radius: var(--radius-full);
      border: 2px solid var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      color: white;
      flex-shrink: 0;
    }
    .mc-avatar + .mc-avatar { margin-left: -6px; }
    .mc-avatar--overflow {
      background: var(--color-secondary);
      color: var(--text-secondary);
    }

    /* ── Footer ── */
    .mc-card__footer {
      padding: 8px 16px 16px;
      flex-shrink: 0;
    }
    .mc-card__footer .btn {
      width: 100%;
    }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background: var(--bg-secondary); }
    .showcase { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }
    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-6);
    }
    .cards-row { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: flex-start; }
    .card-col  { display: flex; flex-direction: column; gap: var(--space-2); }
    .card-label { font-size: var(--font-size-xs); color: var(--text-tertiary); }
  </style>
</head>
<body>

<div class="showcase">
  <p class="section-title">Meetings Card</p>
  <div class="cards-row">

    <!-- ── Horizontal orientation ── -->
    <div class="card-col">
      <span class="card-label">Horizontal</span>
      <div class="mc-card mc-card--horizontal">

        <div class="mc-card__date">
          <div class="mc-date__top">
            <span class="mc-date__month">June</span>
            <span class="mc-date__day">26</span>
          </div>
          <div class="mc-date__bottom">
            <span class="mc-date__label">Today</span>
            <span class="mc-date__count">2 events</span>
          </div>
        </div>

        <div class="mc-card__body">
          <div class="mc-card__list">

            <div class="mc-event">
              <div class="mc-event__line mc-event__line--active"></div>
              <div class="mc-event__body">
                <div>
                  <p class="mc-event__title">Monthly HR Program Check-in</p>
                  <p class="mc-event__time">10:00 am</p>
                </div>
                <div class="mc-event__meta">
                  <div class="mc-avatars">
                    <span class="mc-avatar" style="background:#7b5ea7;">A</span>
                    <span class="mc-avatar" style="background:#4a8fa8;">M</span>
                    <span class="mc-avatar mc-avatar--overflow">+2</span>
                  </div>
                  <button class="btn-iconic btn-ghost btn-xs" aria-label="Recurring event">
                    <span data-icon="repeat"></span>
                  </button>
                </div>
              </div>
            </div>

            <div class="mc-event">
              <div class="mc-event__line mc-event__line--inactive"></div>
              <div class="mc-event__body">
                <div>
                  <p class="mc-event__title">Monthly HR Program Check-in</p>
                  <p class="mc-event__time">10:00 am</p>
                </div>
                <div class="mc-event__meta">
                  <div class="mc-avatars">
                    <span class="mc-avatar" style="background:#7b5ea7;">A</span>
                    <span class="mc-avatar" style="background:#4a8fa8;">M</span>
                    <span class="mc-avatar mc-avatar--overflow">+2</span>
                  </div>
                  <button class="btn-iconic btn-ghost btn-xs" aria-label="Recurring event">
                    <span data-icon="repeat"></span>
                  </button>
                </div>
              </div>
            </div>

          </div>

          <div class="mc-card__footer">
            <button class="btn btn-secondary">View all meetings</button>
          </div>
        </div>

      </div>
    </div>

    <!-- ── Vertical orientation ── -->
    <div class="card-col">
      <span class="card-label">Vertical</span>
      <div class="mc-card mc-card--vertical">

        <div class="mc-card__date">
          <div class="mc-date__top">
            <span class="mc-date__month">June</span>
            <span class="mc-date__day">26</span>
          </div>
          <div class="mc-date__bottom">
            <span class="mc-date__label">Today</span>
            <span class="mc-date__count">2 events</span>
          </div>
        </div>

        <div class="mc-card__body">
          <div class="mc-card__list">

            <div class="mc-event">
              <div class="mc-event__line mc-event__line--active"></div>
              <div class="mc-event__body">
                <div>
                  <p class="mc-event__title">Monthly HR Program Check-in</p>
                  <p class="mc-event__time">10:00 am</p>
                </div>
                <div class="mc-event__meta">
                  <div class="mc-avatars">
                    <span class="mc-avatar" style="background:#7b5ea7;">A</span>
                    <span class="mc-avatar" style="background:#4a8fa8;">M</span>
                    <span class="mc-avatar mc-avatar--overflow">+2</span>
                  </div>
                  <button class="btn-iconic btn-ghost btn-xs" aria-label="Recurring event">
                    <span data-icon="repeat"></span>
                  </button>
                </div>
              </div>
            </div>

            <div class="mc-event">
              <div class="mc-event__line mc-event__line--inactive"></div>
              <div class="mc-event__body">
                <div>
                  <p class="mc-event__title">Monthly HR Program Check-in</p>
                  <p class="mc-event__time">10:00 am</p>
                </div>
                <div class="mc-event__meta">
                  <div class="mc-avatars">
                    <span class="mc-avatar" style="background:#7b5ea7;">A</span>
                    <span class="mc-avatar" style="background:#4a8fa8;">M</span>
                    <span class="mc-avatar mc-avatar--overflow">+2</span>
                  </div>
                  <button class="btn-iconic btn-ghost btn-xs" aria-label="Recurring event">
                    <span data-icon="repeat"></span>
                  </button>
                </div>
              </div>
            </div>

          </div>

          <div class="mc-card__footer">
            <button class="btn btn-secondary">View all meetings</button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    Horizon.initIcons();
  });
</script>

</body>
</html>
