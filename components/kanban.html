<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>

    :root {
      --kb-priority-high: #c2540a;  /* shared by High badge + In Review accent */
    }

    /* ── Page ─────────────────────────────────────────────── */
    .kb-page {
      padding: var(--space-6);
      background: var(--bg-secondary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────── */
    .kb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
      flex-shrink: 0;
    }

    .kb-header-left {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .kb-title {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      line-height: var(--line-height-tight);
    }

    .kb-subtitle {
      font-size: var(--font-size-sm);
      color: var(--text-tertiary);
    }

    .kb-header-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .kb-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 6px var(--space-3);
      border-radius: var(--radius-field);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-sans);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background var(--transition-fast), color var(--transition-fast);
      line-height: 1;
    }

    .kb-btn-primary {
      background: var(--color-primary);
      color: var(--color-primary-content);
    }
    .kb-btn-primary:hover { background: var(--color-primary-hover); }

    .kb-btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border-subtle);
      background: var(--surface-primary);
    }
    .kb-btn-ghost:hover { background: var(--color-ghost-hover); }

    .kb-btn [data-icon] { width: 14px; height: 14px; }

    /* ── Board ────────────────────────────────────────────── */
    .kb-board {
      display: flex;
      gap: var(--space-4);
      overflow-x: auto;
      flex: 1;
      align-items: flex-start;
      padding-bottom: var(--space-4);
    }

    /* Scrollbar */
    .kb-board::-webkit-scrollbar { height: 6px; }
    .kb-board::-webkit-scrollbar-track { background: transparent; }
    .kb-board::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: var(--radius-full); }

    /* ── Column ───────────────────────────────────────────── */
    .kb-col {
      flex: 0 0 272px;
      display: flex;
      flex-direction: column;
      background: var(--bg-tertiary);
      border-radius: var(--radius-lg);
      border-top: 3px solid var(--col-accent, var(--border-default));
      max-height: calc(100vh - 148px);
      overflow: hidden;
    }

    .kb-col-header {
      padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-shrink: 0;
    }

    .kb-col-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      flex: 1;
    }

    .kb-col-count {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--text-tertiary);
      background: var(--surface-secondary);
      border: 1px solid var(--border-subtle);
      padding: 1px 7px;
      border-radius: var(--radius-full);
      min-width: 22px;
      text-align: center;
      line-height: 18px;
    }

    .kb-col-menu {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-tertiary);
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .kb-col-menu:hover {
      background: var(--color-ghost-hover);
      color: var(--text-primary);
    }
    .kb-col-menu [data-icon] { width: 16px; height: 16px; }

    /* ── Card list ────────────────────────────────────────── */
    .kb-card-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 var(--space-3) var(--space-2);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      min-height: 64px;
      transition: background var(--transition-fast);
    }

    .kb-card-list::-webkit-scrollbar { width: 4px; }
    .kb-card-list::-webkit-scrollbar-track { background: transparent; }
    .kb-card-list::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: var(--radius-full); }

    .kb-card-list.drag-over {
      background: rgba(42, 110, 220, 0.05);
      outline: 2px dashed var(--color-info);
      outline-offset: -3px;
      border-radius: var(--radius-md);
    }

    /* ── Card ─────────────────────────────────────────────── */
    .kb-card {
      background: var(--surface-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      cursor: grab;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition-fast), opacity var(--transition-fast), transform var(--transition-fast);
      user-select: none;
    }

    .kb-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .kb-card:active {
      cursor: grabbing;
    }

    .kb-card.dragging {
      opacity: 0.35;
      transform: none;
      box-shadow: var(--shadow-sm);
    }

    .kb-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }

    /* ── Priority badge ───────────────────────────────────── */
    .kb-priority {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      padding: 2px 8px 2px 6px;
      border-radius: var(--radius-full);
      line-height: 16px;
    }

    .kb-priority [data-icon] { width: 11px; height: 11px; }

    .kb-priority-critical { background: #fef2f2; color: var(--color-error); }
    .kb-priority-high     { background: #fff7ed; color: var(--kb-priority-high); }
    .kb-priority-medium   { background: #fefce8; color: var(--color-warning); }
    .kb-priority-low      { background: #f0fdf4; color: var(--color-success); }

    /* ── Card title ───────────────────────────────────────── */
    .kb-card-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      line-height: var(--line-height-snug);
      margin-bottom: var(--space-2);
    }

    /* ── Tags ─────────────────────────────────────────────── */
    .kb-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
      margin-bottom: var(--space-3);
    }

    .kb-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      line-height: 16px;
    }

    /* ── Card footer ──────────────────────────────────────── */
    .kb-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Avatars ──────────────────────────────────────────── */
    .kb-avatars {
      display: flex;
    }

    .kb-avatar {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      border: 2px solid var(--surface-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: var(--font-weight-semibold);
      color: #fff;
      margin-left: -5px;
      flex-shrink: 0;
    }

    .kb-avatars .kb-avatar:first-child { margin-left: 0; }

    /* ── Due date ─────────────────────────────────────────── */
    .kb-due {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      line-height: 1;
    }

    .kb-due [data-icon] { width: 12px; height: 12px; }
    .kb-due.overdue     { color: var(--color-error); }

    /* ── Column footer ────────────────────────────────────── */
    .kb-col-footer {
      padding: var(--space-2) var(--space-3);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .kb-add-card {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      padding: var(--space-2);
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      font-size: var(--font-size-sm);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
      text-align: left;
    }

    .kb-add-card:hover {
      background: var(--color-ghost-hover);
      color: var(--text-primary);
    }

    .kb-add-card [data-icon] { width: 14px; height: 14px; flex-shrink: 0; }

  </style>
</head>
<body>
  <div class="kb-page">

    <!-- Header -->
    <div class="kb-header">
      <div class="kb-header-left">
        <h1 class="kb-title">Sprint 14 — Platform Upgrades</h1>
        <span class="kb-subtitle">13 cards · Updated just now</span>
      </div>
      <div class="kb-header-actions">
        <button class="kb-btn kb-btn-ghost">
          <span data-icon="user-group"></span>
          Assignees
        </button>
        <button class="kb-btn kb-btn-ghost">
          <span data-icon="flag"></span>
          Priority
        </button>
        <button class="kb-btn kb-btn-primary">
          <span data-icon="plus"></span>
          Add card
        </button>
      </div>
    </div>

    <!-- Board -->
    <div class="kb-board" id="kb-board"></div>

  </div>

  <script>
    /* ── Data ─────────────────────────────────────────────────────────── */
    const COLUMNS = [
      { id: 'backlog',     label: 'Backlog',     accent: 'var(--color-neutral)' },
      { id: 'in-progress', label: 'In Progress', accent: 'var(--color-info)' },
      { id: 'in-review',   label: 'In Review',   accent: 'var(--kb-priority-high)' },
      { id: 'done',        label: 'Done',         accent: 'var(--color-success)' },
    ];

    const AVATAR_PALETTE = [
      'var(--color-primary)', 'var(--color-info)', '#7857ff',
      '#b835e6', 'var(--color-success)', '#ea7117'
    ];

    const CARDS = [
      {
        id: 'c1', col: 'backlog', priority: 'low',
        title: 'Audit legacy API endpoints for deprecation',
        tags: ['API', 'Backend'], assignees: ['RK'], due: '2026-04-15'
      },
      {
        id: 'c2', col: 'backlog', priority: 'medium',
        title: 'Update onboarding email templates',
        tags: ['Email', 'UX'], assignees: ['MS', 'JL'], due: '2026-04-20'
      },
      {
        id: 'c3', col: 'backlog', priority: 'high',
        title: 'Spike: evaluate new search indexing library',
        tags: ['Research', 'Search'], assignees: ['AK'], due: '2026-04-10'
      },
      {
        id: 'c4', col: 'in-progress', priority: 'critical',
        title: 'Fix auth token expiry on mobile clients',
        tags: ['Auth', 'Mobile', 'Bug'], assignees: ['JL'], due: '2026-03-28'
      },
      {
        id: 'c5', col: 'in-progress', priority: 'high',
        title: 'Migrate CI pipeline to new runner image',
        tags: ['DevOps', 'CI'], assignees: ['RK', 'AK'], due: '2026-04-02'
      },
      {
        id: 'c6', col: 'in-progress', priority: 'medium',
        title: 'Add pagination to activity log endpoint',
        tags: ['API', 'Performance'], assignees: ['MS'], due: '2026-04-05'
      },
      {
        id: 'c7', col: 'in-progress', priority: 'low',
        title: 'Write unit tests for notification service',
        tags: ['Testing'], assignees: ['JL', 'RK'], due: '2026-04-08'
      },
      {
        id: 'c8', col: 'in-review', priority: 'high',
        title: 'Redesign user settings page',
        tags: ['UX', 'Frontend'], assignees: ['AK'], due: '2026-03-30'
      },
      {
        id: 'c9', col: 'in-review', priority: 'critical',
        title: 'Patch SQL injection vulnerability in reports',
        tags: ['Security', 'Backend'], assignees: ['MS', 'JL'], due: '2026-03-27'
      },
      {
        id: 'c10', col: 'in-review', priority: 'medium',
        title: 'Localise dashboard for DE and FR markets',
        tags: ['i18n'], assignees: ['RK'], due: '2026-04-12'
      },
      {
        id: 'c11', col: 'done', priority: 'high',
        title: 'Upgrade Node.js to v22 LTS',
        tags: ['DevOps'], assignees: ['AK', 'RK'], due: '2026-03-20'
      },
      {
        id: 'c12', col: 'done', priority: 'medium',
        title: 'Document REST API v3 endpoints',
        tags: ['Docs', 'API'], assignees: ['MS'], due: '2026-03-22'
      },
      {
        id: 'c13', col: 'done', priority: 'low',
        title: 'Clean up unused feature flags',
        tags: ['Maintenance'], assignees: ['JL'], due: '2026-03-18'
      },
    ];

    const PRIORITY_META = {
      critical: { label: 'Critical', cls: 'kb-priority-critical' },
      high:     { label: 'High',     cls: 'kb-priority-high'     },
      medium:   { label: 'Medium',   cls: 'kb-priority-medium'   },
      low:      { label: 'Low',      cls: 'kb-priority-low'      },
    };

    /* ── Avatar color map ─────────────────────────────────────────────── */
    const _avatarColors = {};
    let _colorIdx = 0;
    function avatarColor(initials) {
      if (!_avatarColors[initials]) {
        _avatarColors[initials] = AVATAR_PALETTE[_colorIdx++ % AVATAR_PALETTE.length];
      }
      return _avatarColors[initials];
    }

    /* ── Date helpers ─────────────────────────────────────────────────── */
    const TODAY = new Date(new Date().toDateString());
    function isOverdue(due) { return new Date(due) < TODAY; }
    function formatDate(due) {
      return new Date(due).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    /* ── Card HTML ────────────────────────────────────────────────────── */
    function cardHTML(card) {
      const pm      = PRIORITY_META[card.priority];
      const overdue = isOverdue(card.due);
      const tags    = card.tags.map(t => `<span class="kb-tag">${t}</span>`).join('');
      const avatars = card.assignees.map(a =>
        `<span class="kb-avatar" style="background:${avatarColor(a)}" title="${a}">${a}</span>`
      ).join('');

      return `
        <div class="kb-card" draggable="true" data-card-id="${card.id}">
          <div class="kb-card-top">
            <span class="kb-priority ${pm.cls}">
              <span data-icon="flag"></span>${pm.label}
            </span>
          </div>
          <div class="kb-card-title">${card.title}</div>
          ${tags ? `<div class="kb-tags">${tags}</div>` : ''}
          <div class="kb-card-footer">
            <div class="kb-avatars">${avatars}</div>
            <div class="kb-due${overdue ? ' overdue' : ''}">
              <span data-icon="calendar-days"></span>${formatDate(card.due)}
            </div>
          </div>
        </div>`;
    }

    /* ── Render board ─────────────────────────────────────────────────── */
    function renderBoard() {
      const board = document.getElementById('kb-board');
      board.innerHTML = COLUMNS.map(col => {
        const cards = CARDS.filter(c => c.col === col.id);
        return `
          <div class="kb-col" data-col-id="${col.id}" style="--col-accent:${col.accent}">
            <div class="kb-col-header">
              <span class="kb-col-name">${col.label}</span>
              <span class="kb-col-count" data-col-count="${col.id}">${cards.length}</span>
              <button class="kb-col-menu" title="Column options" aria-label="Column options">
                <span data-icon="more-vertical"></span>
              </button>
            </div>
            <div class="kb-card-list" data-col-list="${col.id}">
              ${cards.map(cardHTML).join('')}
            </div>
            <div class="kb-col-footer">
              <button class="kb-add-card" data-col="${col.id}">
                <span data-icon="plus"></span>Add card
              </button>
            </div>
          </div>`;
      }).join('');

      Horizon.initIcons();
      bindDragDrop();
    }

    /* ── Update column counts ─────────────────────────────────────────── */
    function updateCounts() {
      COLUMNS.forEach(col => {
        const el = document.querySelector(`[data-col-count="${col.id}"]`);
        if (el) el.textContent = CARDS.filter(c => c.col === col.id).length;
      });
    }

    /* ── Drag & Drop ──────────────────────────────────────────────────── */
    let draggedId = null;

    function bindDragDrop() {
      document.querySelectorAll('.kb-card').forEach(card => {
        card.addEventListener('dragstart', e => {
          draggedId = card.dataset.cardId;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => card.classList.add('dragging'), 0);
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedId = null;
        });
      });

      document.querySelectorAll('.kb-card-list').forEach(list => {
        list.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          list.classList.add('drag-over');
        });
        list.addEventListener('dragleave', e => {
          if (!list.contains(e.relatedTarget)) list.classList.remove('drag-over');
        });
        list.addEventListener('drop', e => {
          e.preventDefault();
          list.classList.remove('drag-over');
          if (!draggedId) return;

          const targetCol = list.dataset.colList;
          const card = CARDS.find(c => c.id === draggedId);
          if (!card || card.col === targetCol) return;

          card.col = targetCol;
          renderBoard();
        });
      });
    }

    /* ── Init ─────────────────────────────────────────────────────────── */
    renderBoard();
  </script>
</body>
</html>
