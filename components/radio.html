<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Radio — base
    -------------------------------------------------------- */
    .radio-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-weight: var(--font-weight-normal);
      color: var(--text-primary);
      user-select: none;
    }

    .radio-label--disabled {
      opacity: 0.2;
      pointer-events: none;
    }

    /* The control */
    .radio {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid var(--border-default);
      background-color: var(--bg-secondary);
      border-radius: var(--radius-full);
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }

    /* ---- Sizes ---- */
    .radio {
      width: 24px;
      height: 24px;
    }

    .radio-sm {
      width: 20px;
      height: 20px;
    }

    .radio-xs {
      width: 16px;
      height: 16px;
    }

    /* ---- Label text by size ---- */
    .radio-label .radio-text {
      font-size: var(--font-size-sm); /* md: 14px */
      line-height: 1.5rem; /* 24px */
    }

    .radio-label--sm .radio-text {
      font-size: var(--font-size-xs); /* 12px */
      line-height: 1.25rem; /* 20px */
    }

    .radio-label--xs .radio-text {
      font-size: 0.625rem; /* 10px */
      line-height: 1rem; /* 16px */
    }

    /* ---- Checked state ---- */
    .radio:checked {
      border-color: var(--color-primary);
      /* White dot via radial gradient: white center, primary ring */
      background: radial-gradient(circle, white 35%, var(--color-primary) 36%);
      background-color: var(--color-primary);
    }

    /* ---- Hover (unchecked) ---- */
    .radio:not(:checked):hover {
      border-color: var(--color-primary);
    }

    /* ---- Disabled ---- */
    .radio:disabled {
      cursor: not-allowed;
    }

    /* ---- AI loading variant (green border, no dot) ---- */
    .radio--ai-loading {
      border-color: var(--color-accent); /* #68e353 */
    }

    /* --------------------------------------------------------
       Radio Group
    -------------------------------------------------------- */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px; /* md default */
    }

    .radio-group--sm {
      gap: 10px;
    }

    .radio-group--xs {
      gap: 8px;
    }

    .radio-group--horizontal {
      flex-direction: row;
      gap: 16px;
    }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }
    .showcase { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: var(--space-10);
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .state-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- Individual states -->
    <div class="card">
      <p class="section-title">States</p>
      <div class="row">

        <div class="col">
          <span class="state-label">Default</span>
          <label class="radio-label">
            <input type="radio" class="radio" name="states">
            <span class="radio-text">Label</span>
          </label>
        </div>

        <div class="col">
          <span class="state-label">Checked</span>
          <label class="radio-label">
            <input type="radio" class="radio" name="states" checked>
            <span class="radio-text">Label</span>
          </label>
        </div>

        <div class="col">
          <span class="state-label">Disabled</span>
          <label class="radio-label radio-label--disabled">
            <input type="radio" class="radio" disabled>
            <span class="radio-text">Label</span>
          </label>
        </div>

        <div class="col">
          <span class="state-label">Checked + Disabled</span>
          <label class="radio-label radio-label--disabled">
            <input type="radio" class="radio" checked disabled>
            <span class="radio-text">Label</span>
          </label>
        </div>

        <div class="col">
          <span class="state-label">AI Loading</span>
          <label class="radio-label">
            <input type="radio" class="radio radio--ai-loading">
            <span class="radio-text">Label</span>
          </label>
        </div>

      </div>
    </div>

    <!-- Sizes -->
    <div class="card">
      <p class="section-title">Sizes</p>
      <div class="row">

        <div class="col">
          <span class="state-label">md (default) — 24px</span>
          <label class="radio-label">
            <input type="radio" class="radio" name="size-demo-md" checked>
            <span class="radio-text">Label</span>
          </label>
          <label class="radio-label">
            <input type="radio" class="radio" name="size-demo-md">
            <span class="radio-text">Label</span>
          </label>
        </div>

        <div class="col">
          <span class="state-label">sm — 20px</span>
          <label class="radio-label radio-label--sm">
            <input type="radio" class="radio radio-sm" name="size-demo-sm" checked>
            <span class="radio-text">Label</span>
          </label>
          <label class="radio-label radio-label--sm">
            <input type="radio" class="radio radio-sm" name="size-demo-sm">
            <span class="radio-text">Label</span>
          </label>
        </div>

        <div class="col">
          <span class="state-label">xs — 16px</span>
          <label class="radio-label radio-label--xs">
            <input type="radio" class="radio radio-xs" name="size-demo-xs" checked>
            <span class="radio-text">Label</span>
          </label>
          <label class="radio-label radio-label--xs">
            <input type="radio" class="radio radio-xs" name="size-demo-xs">
            <span class="radio-text">Label</span>
          </label>
        </div>

      </div>
    </div>

    <!-- Radio groups — vertical -->
    <div class="card">
      <p class="section-title">Radio Group — Vertical</p>
      <div class="row">

        <div class="col">
          <span class="state-label">md</span>
          <div class="radio-group" role="radiogroup">
            <label class="radio-label"><input type="radio" class="radio" name="v-md" checked><span class="radio-text">Option A</span></label>
            <label class="radio-label"><input type="radio" class="radio" name="v-md"><span class="radio-text">Option B</span></label>
            <label class="radio-label"><input type="radio" class="radio" name="v-md"><span class="radio-text">Option C</span></label>
            <label class="radio-label"><input type="radio" class="radio" name="v-md"><span class="radio-text">Option D</span></label>
          </div>
        </div>

        <div class="col">
          <span class="state-label">sm</span>
          <div class="radio-group radio-group--sm" role="radiogroup">
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="v-sm" checked><span class="radio-text">Option A</span></label>
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="v-sm"><span class="radio-text">Option B</span></label>
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="v-sm"><span class="radio-text">Option C</span></label>
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="v-sm"><span class="radio-text">Option D</span></label>
          </div>
        </div>

        <div class="col">
          <span class="state-label">xs</span>
          <div class="radio-group radio-group--xs" role="radiogroup">
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="v-xs" checked><span class="radio-text">Option A</span></label>
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="v-xs"><span class="radio-text">Option B</span></label>
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="v-xs"><span class="radio-text">Option C</span></label>
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="v-xs"><span class="radio-text">Option D</span></label>
          </div>
        </div>

      </div>
    </div>

    <!-- Radio groups — horizontal -->
    <div class="card">
      <p class="section-title">Radio Group — Horizontal</p>
      <div class="col" style="gap: var(--space-6);">

        <div class="col">
          <span class="state-label">md</span>
          <div class="radio-group radio-group--horizontal" role="radiogroup">
            <label class="radio-label"><input type="radio" class="radio" name="h-md" checked><span class="radio-text">Option A</span></label>
            <label class="radio-label"><input type="radio" class="radio" name="h-md"><span class="radio-text">Option B</span></label>
            <label class="radio-label"><input type="radio" class="radio" name="h-md"><span class="radio-text">Option C</span></label>
            <label class="radio-label"><input type="radio" class="radio" name="h-md"><span class="radio-text">Option D</span></label>
          </div>
        </div>

        <div class="col">
          <span class="state-label">sm</span>
          <div class="radio-group radio-group--horizontal radio-group--sm" role="radiogroup">
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="h-sm" checked><span class="radio-text">Option A</span></label>
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="h-sm"><span class="radio-text">Option B</span></label>
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="h-sm"><span class="radio-text">Option C</span></label>
            <label class="radio-label radio-label--sm"><input type="radio" class="radio radio-sm" name="h-sm"><span class="radio-text">Option D</span></label>
          </div>
        </div>

        <div class="col">
          <span class="state-label">xs</span>
          <div class="radio-group radio-group--horizontal radio-group--xs" role="radiogroup">
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="h-xs" checked><span class="radio-text">Option A</span></label>
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="h-xs"><span class="radio-text">Option B</span></label>
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="h-xs"><span class="radio-text">Option C</span></label>
            <label class="radio-label radio-label--xs"><input type="radio" class="radio radio-xs" name="h-xs"><span class="radio-text">Option D</span></label>
          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
