<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Pagination — container
    -------------------------------------------------------- */
    .pagination {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    /* --------------------------------------------------------
       Pagination button — base (md / default = 40px)
    -------------------------------------------------------- */
    .pagination-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      min-width: 40px;
      padding: 0 16px;
      border: none;
      background: none;
      border-radius: var(--radius-field); /* 12px */
      font-family: var(--font-sans);
      font-size: var(--font-size-sm); /* 14px */
      font-weight: var(--font-weight-normal);
      color: var(--text-tertiary);
      cursor: pointer;
      white-space: nowrap;
      line-height: 1;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .pagination-btn:hover:not(:disabled) {
      background-color: var(--color-neutral-200);
      color: var(--text-primary);
    }

    .pagination-btn:active:not(:disabled) {
      background-color: var(--color-neutral-300);
    }

    /* ---- Active / selected page ---- */
    .pagination-btn--active {
      background-color: var(--color-neutral-300);
      color: var(--text-primary);
    }

    /* ---- Icon-only nav buttons (prev / next) ---- */
    .pagination-btn--icon {
      padding: 0 12px;
    }

    .pagination-btn--icon [data-icon] {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* ---- Disabled ---- */
    .pagination-btn:disabled,
    .pagination-btn--disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ---- Ellipsis ---- */
    .pagination-ellipsis {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      min-width: 40px;
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      color: var(--text-tertiary);
      cursor: default;
    }

    /* --------------------------------------------------------
       Size variants
    -------------------------------------------------------- */

    /* xl — 56px */
    .pagination--xl .pagination-btn {
      height: 56px;
      min-width: 56px;
      padding: 0 24px;
      font-size: 22px;
    }
    .pagination--xl .pagination-btn--icon { padding: 0 16px; }
    .pagination--xl .pagination-ellipsis { height: 56px; min-width: 56px; font-size: 22px; }
    .pagination--xl .pagination-btn--icon [data-icon] { width: 20px; height: 20px; }

    /* lg — 48px */
    .pagination--lg .pagination-btn {
      height: 48px;
      min-width: 48px;
      padding: 0 20px;
      font-size: var(--font-size-lg); /* 18px */
    }
    .pagination--lg .pagination-btn--icon { padding: 0 14px; }
    .pagination--lg .pagination-ellipsis { height: 48px; min-width: 48px; font-size: var(--font-size-lg); }

    /* md — default (40px, already set) */

    /* sm — 32px, radius 8px */
    .pagination--sm .pagination-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 12px;
      font-size: var(--font-size-xs); /* 12px */
      border-radius: 8px;
    }
    .pagination--sm .pagination-btn--icon { padding: 0 8px; }
    .pagination--sm .pagination-ellipsis { height: 32px; min-width: 32px; font-size: var(--font-size-xs); }
    .pagination--sm .pagination-btn--icon [data-icon] { width: 14px; height: 14px; }

    /* xs — 24px, radius 8px */
    .pagination--xs .pagination-btn {
      height: 24px;
      min-width: 24px;
      padding: 0 8px;
      font-size: 11px;
      border-radius: 8px;
    }
    .pagination--xs .pagination-btn--icon { padding: 0 6px; }
    .pagination--xs .pagination-ellipsis { height: 24px; min-width: 24px; font-size: 11px; }
    .pagination--xs .pagination-btn--icon [data-icon] { width: 12px; height: 12px; }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }
    .showcase { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    .state-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- Page button sizes -->
    <div class="card">
      <p class="section-title">Page Button Sizes</p>
      <div class="row">

        <div class="col">
          <span class="state-label">xl (56px)</span>
          <nav class="pagination pagination--xl" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">2</button>
            <button class="pagination-btn">3</button>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">lg (48px)</span>
          <nav class="pagination pagination--lg" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">2</button>
            <button class="pagination-btn">3</button>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">md (40px) — default</span>
          <nav class="pagination" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">2</button>
            <button class="pagination-btn">3</button>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">sm (32px)</span>
          <nav class="pagination pagination--sm" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">2</button>
            <button class="pagination-btn">3</button>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">xs (24px)</span>
          <nav class="pagination pagination--xs" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">2</button>
            <button class="pagination-btn">3</button>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

      </div>
    </div>

    <!-- Assembled pagination with truncation -->
    <div class="card">
      <p class="section-title">Assembled — With Truncation</p>
      <div class="row">

        <div class="col">
          <span class="state-label">Many pages — current in middle</span>
          <nav class="pagination" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <span class="pagination-ellipsis">…</span>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">5</button>
            <button class="pagination-btn">6</button>
            <span class="pagination-ellipsis">…</span>
            <button class="pagination-btn">12</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">First page (prev disabled)</span>
          <nav class="pagination" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon pagination-btn--disabled" aria-label="Previous" disabled><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">1</button>
            <button class="pagination-btn">2</button>
            <button class="pagination-btn">3</button>
            <span class="pagination-ellipsis">…</span>
            <button class="pagination-btn">12</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">Last page (next disabled)</span>
          <nav class="pagination" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <span class="pagination-ellipsis">…</span>
            <button class="pagination-btn">10</button>
            <button class="pagination-btn">11</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">12</button>
            <button class="pagination-btn pagination-btn--icon pagination-btn--disabled" aria-label="Next" disabled><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">sm — With truncation</span>
          <nav class="pagination pagination--sm" aria-label="Pagination">
            <button class="pagination-btn pagination-btn--icon" aria-label="Previous"><span data-icon="chevron-left"></span></button>
            <button class="pagination-btn">1</button>
            <span class="pagination-ellipsis">…</span>
            <button class="pagination-btn">4</button>
            <button class="pagination-btn pagination-btn--active" aria-current="page">5</button>
            <button class="pagination-btn">6</button>
            <span class="pagination-ellipsis">…</span>
            <button class="pagination-btn">12</button>
            <button class="pagination-btn pagination-btn--icon" aria-label="Next"><span data-icon="chevron-right"></span></button>
          </nav>
        </div>

      </div>
    </div>

    <!-- Interactive pagination -->
    <div class="card">
      <p class="section-title">Interactive</p>
      <nav class="pagination js-pagination" id="interactive-pagination" aria-label="Pagination">
        <button class="pagination-btn pagination-btn--icon js-prev" aria-label="Previous" disabled><span data-icon="chevron-left"></span></button>
        <!-- pages injected by JS -->
        <button class="pagination-btn pagination-btn--icon js-next" aria-label="Next"><span data-icon="chevron-right"></span></button>
      </nav>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Horizon.initIcons();
      initInteractivePagination();
    });

    function initInteractivePagination() {
      const totalPages = 8;
      let currentPage = 1;
      const nav = document.getElementById('interactive-pagination');
      const prevBtn = nav.querySelector('.js-prev');
      const nextBtn = nav.querySelector('.js-next');

      function render() {
        // Remove existing page buttons
        nav.querySelectorAll('.js-page, .js-ellipsis').forEach(el => el.remove());

        const insertBefore = nextBtn;

        function addPage(num) {
          const btn = document.createElement('button');
          btn.className = 'pagination-btn js-page' + (num === currentPage ? ' pagination-btn--active' : '');
          if (num === currentPage) btn.setAttribute('aria-current', 'page');
          btn.textContent = num;
          btn.addEventListener('click', () => { currentPage = num; render(); });
          nav.insertBefore(btn, insertBefore);
        }

        function addEllipsis() {
          const span = document.createElement('span');
          span.className = 'pagination-ellipsis js-ellipsis';
          span.textContent = '…';
          nav.insertBefore(span, insertBefore);
        }

        // Simple truncation logic
        if (totalPages <= 5) {
          for (let i = 1; i <= totalPages; i++) addPage(i);
        } else {
          addPage(1);
          if (currentPage > 3) addEllipsis();
          for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) addPage(i);
          if (currentPage < totalPages - 2) addEllipsis();
          addPage(totalPages);
        }

        prevBtn.disabled = currentPage === 1;
        prevBtn.classList.toggle('pagination-btn--disabled', currentPage === 1);
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.classList.toggle('pagination-btn--disabled', currentPage === totalPages);
        Horizon.initIcons();
      }

      prevBtn.addEventListener('click', () => { if (currentPage > 1) { currentPage--; render(); } });
      nextBtn.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; render(); } });
      render();
    }
  </script>

</body>
</html>
