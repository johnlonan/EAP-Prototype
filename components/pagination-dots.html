<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagination Dots — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Pagination Dots — container
       Full pill-shaped track containing the dots.
    -------------------------------------------------------- */
    .pagination-dots {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      gap: 10px;           /* lg default */
      padding: 12px 16px;  /* lg default */
    }

    /* ---- Dot base ---- */
    .pagination-dot {
      flex-shrink: 0;
      border-radius: 9999px;
      background-color: rgba(0, 0, 0, 0.15);
      transition: background-color var(--transition-fast), transform var(--transition-fast);
      /* lg default */
      width: 10px;
      height: 10px;
    }

    .pagination-dot--selected {
      background-color: rgba(0, 0, 0, 0.5);
    }

    /* ---- Size: md (8px dot) ---- */
    .pagination-dots--md {
      gap: 8px;
      padding: 12px;
    }
    .pagination-dots--md .pagination-dot {
      width: 8px;
      height: 8px;
    }

    /* ---- Size: sm (7px dot) ---- */
    .pagination-dots--sm {
      gap: 6px;
      padding: 10px 12px;
    }
    .pagination-dots--sm .pagination-dot {
      width: 7px;
      height: 7px;
    }

    /* ---- Size: xs (5px dot) ---- */
    .pagination-dots--xs {
      gap: 4px;
      padding: 8px 10px;
    }
    .pagination-dots--xs .pagination-dot {
      width: 5px;
      height: 5px;
    }

    /* ---- Interactive: clickable dots ---- */
    .pagination-dots--interactive .pagination-dot {
      cursor: pointer;
    }
    .pagination-dots--interactive .pagination-dot:hover:not(.pagination-dot--selected) {
      background-color: rgba(0, 0, 0, 0.3);
    }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }
    .showcase { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--space-6);
      align-items: start;
    }

    .state-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
    }

    /* Dark bg demo */
    .demo-dark {
      background: #1a1a1a;
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .demo-dark .pagination-dot {
      background-color: rgba(255, 255, 255, 0.3);
    }
    .demo-dark .pagination-dot--selected {
      background-color: rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- Sizes — 3rd dot selected -->
    <div class="card">
      <p class="section-title">Sizes</p>
      <div class="grid">

        <div class="col">
          <span class="state-label">lg (10px)</span>
          <nav class="pagination-dots" aria-label="Page 3 of 5">
            <button class="pagination-dot" aria-label="Page 1"></button>
            <button class="pagination-dot" aria-label="Page 2"></button>
            <button class="pagination-dot pagination-dot--selected" aria-label="Page 3 (current)" aria-current="true"></button>
            <button class="pagination-dot" aria-label="Page 4"></button>
            <button class="pagination-dot" aria-label="Page 5"></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">md (8px)</span>
          <nav class="pagination-dots pagination-dots--md" aria-label="Page 3 of 5">
            <button class="pagination-dot" aria-label="Page 1"></button>
            <button class="pagination-dot" aria-label="Page 2"></button>
            <button class="pagination-dot pagination-dot--selected" aria-label="Page 3 (current)" aria-current="true"></button>
            <button class="pagination-dot" aria-label="Page 4"></button>
            <button class="pagination-dot" aria-label="Page 5"></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">sm (7px)</span>
          <nav class="pagination-dots pagination-dots--sm" aria-label="Page 3 of 5">
            <button class="pagination-dot" aria-label="Page 1"></button>
            <button class="pagination-dot" aria-label="Page 2"></button>
            <button class="pagination-dot pagination-dot--selected" aria-label="Page 3 (current)" aria-current="true"></button>
            <button class="pagination-dot" aria-label="Page 4"></button>
            <button class="pagination-dot" aria-label="Page 5"></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">xs (5px)</span>
          <nav class="pagination-dots pagination-dots--xs" aria-label="Page 3 of 5">
            <button class="pagination-dot" aria-label="Page 1"></button>
            <button class="pagination-dot" aria-label="Page 2"></button>
            <button class="pagination-dot pagination-dot--selected" aria-label="Page 3 (current)" aria-current="true"></button>
            <button class="pagination-dot" aria-label="Page 4"></button>
            <button class="pagination-dot" aria-label="Page 5"></button>
          </nav>
        </div>

      </div>
    </div>

    <!-- Different selected positions -->
    <div class="card">
      <p class="section-title">Selected Position Variants</p>
      <div class="grid">

        <div class="col">
          <span class="state-label">First selected</span>
          <nav class="pagination-dots pagination-dots--md">
            <button class="pagination-dot pagination-dot--selected"></button>
            <button class="pagination-dot"></button>
            <button class="pagination-dot"></button>
            <button class="pagination-dot"></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">Second selected</span>
          <nav class="pagination-dots pagination-dots--md">
            <button class="pagination-dot"></button>
            <button class="pagination-dot pagination-dot--selected"></button>
            <button class="pagination-dot"></button>
            <button class="pagination-dot"></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">Third selected</span>
          <nav class="pagination-dots pagination-dots--md">
            <button class="pagination-dot"></button>
            <button class="pagination-dot"></button>
            <button class="pagination-dot pagination-dot--selected"></button>
            <button class="pagination-dot"></button>
          </nav>
        </div>

        <div class="col">
          <span class="state-label">Last selected</span>
          <nav class="pagination-dots pagination-dots--md">
            <button class="pagination-dot"></button>
            <button class="pagination-dot"></button>
            <button class="pagination-dot"></button>
            <button class="pagination-dot pagination-dot--selected"></button>
          </nav>
        </div>

      </div>
    </div>

    <!-- On dark background -->
    <div class="card">
      <p class="section-title">On Dark Background</p>
      <div class="grid">
        <div class="col">
          <span class="state-label">Dark bg — lg</span>
          <div class="demo-dark">
            <nav class="pagination-dots" aria-label="Slideshow">
              <button class="pagination-dot"></button>
              <button class="pagination-dot pagination-dot--selected"></button>
              <button class="pagination-dot"></button>
              <button class="pagination-dot"></button>
            </nav>
          </div>
        </div>
        <div class="col">
          <span class="state-label">Dark bg — sm</span>
          <div class="demo-dark">
            <nav class="pagination-dots pagination-dots--sm" aria-label="Slideshow">
              <button class="pagination-dot"></button>
              <button class="pagination-dot pagination-dot--selected"></button>
              <button class="pagination-dot"></button>
              <button class="pagination-dot"></button>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <!-- Interactive -->
    <div class="card">
      <p class="section-title">Interactive</p>
      <div style="display:flex; flex-direction:column; gap: 16px; align-items: flex-start;">
        <nav class="pagination-dots pagination-dots--interactive js-dots-nav" id="dots-interactive" aria-label="Carousel">
          <button class="pagination-dot pagination-dot--selected" aria-label="Slide 1" data-index="0"></button>
          <button class="pagination-dot" aria-label="Slide 2" data-index="1"></button>
          <button class="pagination-dot" aria-label="Slide 3" data-index="2"></button>
          <button class="pagination-dot" aria-label="Slide 4" data-index="3"></button>
          <button class="pagination-dot" aria-label="Slide 5" data-index="4"></button>
        </nav>
        <p id="dots-info" style="font-size: var(--font-size-xs); color: var(--text-tertiary);">Slide 1 of 5</p>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Horizon.initIcons();

      // Interactive dots
      const nav = document.getElementById('dots-interactive');
      const info = document.getElementById('dots-info');
      nav.querySelectorAll('.pagination-dot').forEach((dot, idx) => {
        dot.addEventListener('click', () => {
          nav.querySelectorAll('.pagination-dot').forEach(d => d.classList.remove('pagination-dot--selected'));
          dot.classList.add('pagination-dot--selected');
          info.textContent = `Slide ${idx + 1} of 5`;
        });
      });
    });
  </script>

</body>
</html>
