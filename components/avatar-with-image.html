<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar with Image — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Avatar with Image
       A rounded-square image (border-radius: 8px) with a small
       circular avatar overlaid at the bottom-right corner.
       The overlay has a white ring border.

       Sizes:
         sm  — 40px main · 20px overlay circle
         md  — 48px main · 24px overlay circle
         lg  — 56px main · 32px overlay circle
         xl  — 64px main · 32px overlay circle
         2xl — 80px main · 32px overlay circle
    -------------------------------------------------------- */

    .avatar-with-img {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
      /* default: md */
      width: 48px;
      height: 48px;
    }

    /* ---- Main image (rounded square) ---- */
    .avatar-with-img__main {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-lg, 8px);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      background-color: var(--bg-secondary);
    }

    .avatar-with-img__main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ---- Overlay avatar (circle) ---- */
    .avatar-with-img__overlay {
      position: absolute;
      bottom: -4px;
      right: -6px;
      border-radius: 9999px;
      border: 2px solid white;
      background-color: var(--color-neutral-800, #343331);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-weight: var(--font-weight-semibold);
      color: white;
      overflow: hidden;
      flex-shrink: 0;
      /* default: md → 24px */
      width: 24px;
      height: 24px;
      font-size: 10px;
    }

    .avatar-with-img__overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ---- Sizes ---- */
    .avatar-with-img--sm {
      width: 40px;
      height: 40px;
    }
    .avatar-with-img--sm .avatar-with-img__overlay {
      width: 20px;
      height: 20px;
      font-size: 9px;
      right: -5px;
      bottom: -3px;
    }

    .avatar-with-img--md {
      width: 48px;
      height: 48px;
    }
    /* md overlay is default above */

    .avatar-with-img--lg {
      width: 56px;
      height: 56px;
    }
    .avatar-with-img--lg .avatar-with-img__overlay {
      width: 32px;
      height: 32px;
      font-size: 12px;
      right: -7px;
      bottom: -5px;
      border-width: 2.5px;
    }

    .avatar-with-img--xl {
      width: 64px;
      height: 64px;
    }
    .avatar-with-img--xl .avatar-with-img__overlay {
      width: 32px;
      height: 32px;
      font-size: 12px;
      right: -7px;
      bottom: -5px;
      border-width: 2.5px;
    }

    .avatar-with-img--2xl {
      width: 80px;
      height: 80px;
    }
    .avatar-with-img--2xl .avatar-with-img__overlay {
      width: 32px;
      height: 32px;
      font-size: 12px;
      right: -8px;
      bottom: -6px;
      border-width: 2.5px;
    }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }
    .showcase { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: var(--space-8);
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      align-items: flex-start;
    }

    .state-label {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
    }

    /* Inline avatar for overlay demos */
    .inline-avatar {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Photo placeholder SVGs */
    .photo-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #7ab8d0 0%, #0e4e69 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-placeholder svg {
      width: 55%;
      height: 55%;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- Sizes -->
    <div class="card">
      <p class="section-title">Sizes — Initials overlay</p>
      <div class="row">

        <div class="col">
          <span class="state-label">sm — 40px</span>
          <div class="avatar-with-img avatar-with-img--sm">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay">JD</div>
          </div>
        </div>

        <div class="col">
          <span class="state-label">md — 48px</span>
          <div class="avatar-with-img avatar-with-img--md">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder" style="background: linear-gradient(135deg, #a8d5b5 0%, #1a6b3c 100%);">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay">MK</div>
          </div>
        </div>

        <div class="col">
          <span class="state-label">lg — 56px</span>
          <div class="avatar-with-img avatar-with-img--lg">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder" style="background: linear-gradient(135deg, #c4b5e8 0%, #5a3e8a 100%);">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay">SA</div>
          </div>
        </div>

        <div class="col">
          <span class="state-label">xl — 64px</span>
          <div class="avatar-with-img avatar-with-img--xl">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder" style="background: linear-gradient(135deg, #f5c5d0 0%, #943870 100%);">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay">RL</div>
          </div>
        </div>

        <div class="col">
          <span class="state-label">2xl — 80px</span>
          <div class="avatar-with-img avatar-with-img--2xl">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder" style="background: linear-gradient(135deg, #fdc5a0 0%, #b5420a 100%);">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay">BN</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Overlay variants -->
    <div class="card">
      <p class="section-title">Overlay Types — md (48px)</p>
      <div class="row" style="align-items: flex-start;">

        <div class="col">
          <span class="state-label">Initials</span>
          <div class="avatar-with-img avatar-with-img--md">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay">JD</div>
          </div>
        </div>

        <div class="col">
          <span class="state-label">Icon overlay</span>
          <div class="avatar-with-img avatar-with-img--md">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder" style="background: linear-gradient(135deg, #a8d5b5 0%, #1a6b3c 100%);">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay" style="color: rgba(255,255,255,0.9);">
              <span data-icon="user" style="width:12px;height:12px;"></span>
            </div>
          </div>
        </div>

        <div class="col">
          <span class="state-label">Primary color overlay</span>
          <div class="avatar-with-img avatar-with-img--md">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder" style="background: linear-gradient(135deg, #c4b5e8 0%, #5a3e8a 100%);">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay" style="background-color: var(--color-primary);">SA</div>
          </div>
        </div>

        <div class="col">
          <span class="state-label">Status badge variant</span>
          <div class="avatar-with-img avatar-with-img--lg">
            <div class="avatar-with-img__main">
              <div class="photo-placeholder" style="background: linear-gradient(135deg, #fdc5a0 0%, #b5420a 100%);">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
              </div>
            </div>
            <div class="avatar-with-img__overlay" style="background-color: #22c55e; font-size:0;">
              <!-- status dot styled as circle -->
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Usage in context -->
    <div class="card">
      <p class="section-title">Usage in Context — Record Header</p>
      <div style="display: flex; align-items: center; gap: 16px; padding: 8px 0;">
        <div class="avatar-with-img avatar-with-img--xl">
          <div class="avatar-with-img__main">
            <div class="photo-placeholder" style="background: linear-gradient(135deg, #7ab8d0 0%, #0e4e69 100%);">
              <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4" fill="white" fill-opacity="0.8"/><path d="M4 21c0-5 3.6-8 8-8s8 3 8 8" fill="white" fill-opacity="0.8"/></svg>
            </div>
          </div>
          <div class="avatar-with-img__overlay">JD</div>
        </div>
        <div>
          <div style="font-family: var(--font-sans); font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); color: var(--text-primary);">John Doe</div>
          <div style="font-family: var(--font-sans); font-size: var(--font-size-sm); color: var(--text-tertiary);">Senior Software Engineer · Platform Team</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Horizon.initIcons();
    });
  </script>

</body>
</html>
