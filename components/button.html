<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button — Horizon 2.0</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/interactions.js" defer></script>
  <style>
    /* --------------------------------------------------------
       Button base
    -------------------------------------------------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 16px;
      height: 40px;
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-normal);
      line-height: 1.8;
      white-space: nowrap;
      border: none;
      border-radius: var(--radius-field);
      cursor: pointer;
      text-decoration: none;
      transition: background-color var(--transition-fast),
                  color var(--transition-fast),
                  opacity var(--transition-fast);
    }

    .btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .btn:disabled,
    .btn[aria-disabled="true"] {
      opacity: 0.35;
      pointer-events: none;
      cursor: not-allowed;
    }

    .btn .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* --------------------------------------------------------
       Color variants
    -------------------------------------------------------- */
    .btn-primary {
      background-color: var(--color-primary);
      color: var(--color-primary-content);
    }
    .btn-primary:hover  { background-color: var(--color-primary-hover); }
    .btn-primary:active { background-color: var(--color-primary-active); }

    .btn-secondary {
      background-color: var(--color-secondary);
      color: var(--color-secondary-content);
    }
    .btn-secondary:hover  { background-color: var(--color-secondary-hover); }
    .btn-secondary:active { background-color: var(--color-secondary-active); }

    .btn-accent {
      background-color: var(--color-accent);
      color: var(--color-accent-content);
    }
    .btn-accent:hover  { background-color: var(--color-accent-hover); }
    .btn-accent:active { background-color: var(--color-accent-active); }

    .btn-error {
      background-color: var(--color-error);
      color: var(--color-error-content);
    }
    .btn-error:hover  { background-color: var(--color-error-hover); }
    .btn-error:active { background-color: var(--color-error-active); }

    .btn-neutral {
      background-color: var(--color-neutral);
      color: var(--color-neutral-content);
    }
    .btn-neutral:hover  { background-color: var(--color-neutral-hover); }
    .btn-neutral:active { background-color: var(--color-neutral-active); }

    .btn-ghost {
      background-color: transparent;
      color: var(--text-primary);
    }
    .btn-ghost:hover  { background-color: var(--color-ghost-hover); }
    .btn-ghost:active { background-color: var(--color-ghost-active); }

    .btn-link {
      background-color: transparent;
      color: var(--color-link);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: transparent;
    }
    .btn-link:hover {
      color: var(--color-link-hover);
      text-decoration-color: currentColor;
    }
    .btn-link:active { color: var(--color-primary-active); }

    /* --------------------------------------------------------
       Size variants
    -------------------------------------------------------- */
    .btn-xl {
      height: 56px;
      padding: 0 24px;
      font-size: 1.375rem; /* 22px */
      border-radius: var(--radius-field); /* 12px */
      gap: 8px;
    }
    .btn-xl .btn-icon { width: 24px; height: 24px; }

    .btn-lg {
      height: 48px;
      padding: 0 20px;
      font-size: var(--font-size-lg); /* 18px */
      border-radius: var(--radius-field); /* 12px */
      gap: 6px;
    }
    .btn-lg .btn-icon { width: 20px; height: 20px; }

    /* .btn-md is the default — no extra class needed */

    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: var(--font-size-xs); /* 12px */
      border-radius: var(--radius-lg); /* 8px */
      gap: 4px;
    }
    .btn-sm .btn-icon { width: 16px; height: 16px; }

    .btn-xs {
      height: 24px;
      padding: 0 8px;
      font-size: 0.6875rem; /* 11px */
      border-radius: var(--radius-lg); /* 8px */
      gap: 4px;
    }
    .btn-xs .btn-icon { width: 12px; height: 12px; }

    /* --------------------------------------------------------
       Showcase layout
    -------------------------------------------------------- */
    body { padding: var(--space-8); background-color: var(--bg-secondary); }

    .showcase { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-12); }

    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: var(--space-4);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
    }

    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      border: 1px solid var(--border-subtle);
    }

    .card-dark {
      background: var(--bg-inverted);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
    }
  </style>
</head>
<body>

  <div class="showcase">

    <!-- Color variants -->
    <div class="card">
      <p class="section-title">Color Variants</p>
      <div class="row">
        <button class="btn btn-primary">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Primary
        </button>
        <button class="btn btn-secondary">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Secondary
        </button>
        <button class="btn btn-accent">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Accent
        </button>
        <button class="btn btn-error">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Destructive
        </button>
        <button class="btn btn-neutral">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Neutral
        </button>
        <button class="btn btn-ghost">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Ghost
        </button>
        <button class="btn btn-link">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Link
        </button>
      </div>
    </div>

    <!-- Sizes -->
    <div class="card">
      <p class="section-title">Sizes</p>
      <div class="row">
        <button class="btn btn-primary btn-xl">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Extra Large
        </button>
        <button class="btn btn-primary btn-lg">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Large
        </button>
        <button class="btn btn-primary">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Medium
        </button>
        <button class="btn btn-primary btn-sm">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Small
        </button>
        <button class="btn btn-primary btn-xs">
          <span class="btn-icon" data-icon="chevron-left"></span>
          XSmall
        </button>
      </div>
    </div>

    <!-- Icon positions -->
    <div class="card">
      <p class="section-title">Icon Positions</p>
      <div class="row">
        <button class="btn btn-primary">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Icon Left
        </button>
        <button class="btn btn-primary">
          Icon Right
          <span class="btn-icon" data-icon="chevron-right"></span>
        </button>
        <button class="btn btn-primary">
          No Icon
        </button>
        <button class="btn btn-primary">
          <span class="btn-icon" data-icon="chevron-left"></span>
          Both Icons
          <span class="btn-icon" data-icon="chevron-right"></span>
        </button>
      </div>
    </div>

    <!-- Disabled states -->
    <div class="card">
      <p class="section-title">Disabled</p>
      <div class="row">
        <button class="btn btn-primary" disabled>
          <span class="btn-icon" data-icon="chevron-left"></span>
          Primary
        </button>
        <button class="btn btn-secondary" disabled>Secondary</button>
        <button class="btn btn-accent" disabled>Accent</button>
        <button class="btn btn-error" disabled>Destructive</button>
        <button class="btn btn-ghost" disabled>Ghost</button>
        <button class="btn btn-link" disabled>Link</button>
      </div>
    </div>

  </div>

</body>
</html>
