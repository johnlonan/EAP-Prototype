window.__REQUIREMENTS_DATA__ = { ...(window.__REQUIREMENTS_DATA__ || {}), sysProperties: { 'com.glide.cs.collab.enabled': 'true' }, plugins: { 'com.glide.cs.collab': true } };

} catch (e) { /* storage blocked: the navigation still renders, without active apps */ }
const __leaf = ([label, url], i, p) => ({ id: p + i, label, subItems: [], route: { url } });
const __MENU = { result: [

] };
const __fetch = window.fetch.bind(window);
window.fetch = (u, o) => {
  const s = String(u && u.url ? u.url : u);
  const json = (b) => Promise.resolve(new Response(JSON.stringify(b), { status: 200, headers: { 'Content-Type': 'application/json' } }));
  if (s.includes('/api/now/ui/polaris/menu')) return json(__MENU);

  if (s.includes('/api/now/graphql')) return json({ data: {} });
  // any other same-origin platform call (preferences, shortcuts, batch, data broker): an empty answer
  if (/^(?:https?:\/\/[^/]+)?\/api\/now\//.test(s) && (s.startsWith('/') || s.startsWith(location.origin))) return json({ result: {} });
  if (s.includes('keyboard-shortcut')) return json({ result: {} });

<script>
(function () {
  var shown = false;
  function reveal() { if (shown) return; shown = true; document.documentElement.classList.remove('ow-pre'); }
  Promise.all([customElements.whenDefined('aiux-nav-sidebar'), customElements.whenDefined('aiux-icon')]).then(function () { setTimeout(reveal, 120); });
  setTimeout(reveal, 2500);
  var E = Otto.esc, $ = function (id) { return document.getElementById(id); }, toastTimer = null, D = null;
  var KEY = 'proto.ad.state', KEYT = 'proto.ad.took';
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function badge(b) { return '<span class="aiux-badge aiux-badge-sm aiux-badge-soft aiux-badge-' + b.tone + ' ow-pill">' + E(b.label) + '</span>'; }
  function head(title, meta, by, inline) { return '<div class="ad-head"><div><div class="ad-h2"><h2 class="text-base font-medium">' + E(title) + '</h2>' + (inline || '') + '</div>' + (meta ? '<p class="text-xs text-text-secondary">' + E(meta) + '</p>' : '') + '</div>' + (by || '') + '</div>'; }
  function byAi(d, k) { return '<span class="ad-by is-ai text-xs" tabindex="0" data-tip="' + E(d.tips[k]) + '"><aiux-icon name="ai-sparkle-outline" size="sm"></aiux-icon>' + E(d.aiLabel) + '</span>'; }
  function bySp(d, k) { return '<span class="ad-by text-xs" tabindex="0" data-tip="' + E(d.tips[k]) + '"><img class="ow-spimg" width="20" height="20" data-img="1" alt="">' + E(d.specialist.name) + '</span>'; }
  function card(cls, inner) { return '<section class="ow-card ad-card ' + cls + '">' + inner + '</section>'; }
  function toast(text) { var t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200); }
  function fmt(ms) { var s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }

  /* ---------- card builders: each returns the real card for one slot ---------- */
  var B = {
    glance: function (d) { return card('ad-glance', d.glance.map(function (g) { return '<div class="ad-g"><span class="text-xs text-text-secondary">' + E(g.label) + '</span><span class="ad-gv' + (g.tone ? ' is-' + g.tone : '') + '">' + E(g.value) + '</span><span class="text-xs text-text-tertiary">' + E(g.note) + '</span></div>'; }).join('')); },
    rec: function (d) {
      var sm = d.summary;
      return '<div class="ad-rec is-' + E(sm.recTone) + '"><div class="ad-rec-top"><span class="text-sm text-text-secondary">' + E(sm.recLabel) + '</span><span class="ad-conf" data-tip="' + E(sm.confidence.tip) + '"><span class="text-sm text-text-secondary">' + E(sm.confidence.label) + '</span><span class="ad-meter" aria-hidden="true">' + Array.apply(null, Array(sm.confidence.of)).map(function (_, i) { return '<i' + (i < sm.confidence.filled ? ' class="on"' : '') + '></i>'; }).join('') + '</span><strong class="text-sm font-medium">' + E(sm.confidence.level) + '</strong></span></div><div class="ad-rec-v">' + E(sm.rec) + '</div><p class="text-sm">' + E(sm.recBody) + '</p></div>';
    },
    policy: function (d) {
      var P = d.specialist.review, pol = d.policy;
      var rows = P.present.map(function (r) { return { label: r.label, detail: r.by, src: pol.srcPresent }; }).concat(P.missing.map(function (r) { return { label: r.label, detail: r.value, src: pol.srcAdded }; }));
      var table = '<div class="ad-tbl"><div class="ad-tr ad-th text-xs text-text-secondary"><span></span><span>' + E(pol.cols.req) + '</span><span>' + E(pol.cols.detail) + '</span><span>' + E(pol.cols.src) + '</span></div>'
        + rows.map(function (r) { return '<div class="ad-tr"><span class="ad-ok"><aiux-icon name="' + E(P.icons.present) + '" size="sm"></aiux-icon></span><span>' + E(r.label) + '</span><span class="text-text-secondary">' + E(r.detail) + '</span><span class="text-text-secondary">' + E(r.src) + '</span></div>'; }).join('') + '</div>';
      var filled = '<h3 class="ad-sub text-sm font-medium">' + E(pol.filled) + '</h3><div class="ad-fill">' + P.filled.map(function (f) { return '<div class="ad-f"><span class="text-xs text-text-secondary">' + E(f.label) + '</span><span class="ad-fv">' + E(f.value) + '</span><span class="text-xs text-text-tertiary">' + E(f.why) + '</span></div>'; }).join('') + '</div>';
      return card('', head(pol.title, pol.meta, bySp(d, 'policy')) + table + filled);
    },
    similar: function (d) {
      var sim = d.similar;
      return card('', head(sim.title, sim.meta, bySp(d, 'similar'), badge({ label: sim.count, tone: sim.countTone || 'warning' })) + '<div class="ad-sdl">' + sim.items.map(function (i) {
        return '<div class="ad-sd"><div class="ad-sd-top"><a class="ac-link text-base" href="#" data-soon="1">' + E(i.title) + '</a>' + badge({ label: i.match, tone: i.tone }) + '</div>'
          + '<span class="ad-sd-ref text-xs text-text-tertiary">' + E(i.ref) + ' · ' + E(i.state) + '</span>'
          + '<p class="ad-sd-why text-sm text-text-secondary">' + E(i.why) + '</p>'
          + '<span class="ad-sd-foot text-xs text-text-tertiary">' + E(i.by) + ' · ' + E(i.dates) + '</span></div>'; }).join('') + '</div>');
    },
    details: function (d) { return card('', head(d.details.title, '').replace('<p class="text-xs text-text-secondary"></p>', '') + '<dl class="ad-kv">' + d.details.rows.map(function (r) { return '<div><dt class="text-sm text-text-secondary">' + E(r[0]) + '</dt><dd>' + E(r[1]) + '</dd></div>'; }).join('') + '</dl>'); },
    signals: function (d) {
      var sg = d.signals;
      return card('', head(sg.title, sg.meta, byAi(d, 'signals'), badge({ label: sg.count, tone: 'warning' })) + '<div class="ad-sig">' + sg.items.map(function (i) { return '<div class="ad-sg"><span class="ad-n">' + E(i.n) + '</span><div><div class="text-sm font-medium">' + E(i.title) + '</div><div class="text-sm text-text-secondary">' + E(i.body) + '</div></div></div>'; }).join('') + '</div>');
    },
    assess: function (d) {
      var as = d.assess, P = d.specialist.review;
      return card('', head(as.title, as.meta, bySp(d, 'assess')) + '<div class="ad-list">' + as.items.map(function (i) { return '<div class="ad-as"><span class="ad-as-l">' + (as.done === false ? '' : '<span class="ad-ok"><aiux-icon name="' + E(P.icons.present) + '" size="sm"></aiux-icon></span>') + E(i) + '</span><span class="text-xs text-text-tertiary">' + E(as.status) + '</span></div>'; }).join('') + '</div>');
    },
    prio: function (d) {
      var pr = d.priority;
      return card('ad-prio', head(pr.title, pr.meta, byAi(d, 'priority')) + '<div class="ad-map"><span class="text-xs text-text-secondary">' + E(pr.mapped.label) + '</span><span>' + E(pr.mapped.value) + '</span></div><div class="ad-tiles ad-tiles-3">' + pr.rows.map(function (r) { return '<div class="ad-tile"><span class="ad-tv is-' + r.tone + '">' + E(r.value) + E(pr.unit) + '</span><span class="text-xs text-text-secondary">' + E(r.label) + '</span><div class="ad-track is-' + r.tone + '"><span style="width:' + r.value + '%"></span></div></div>'; }).join('') + '</div><div class="ad-rs"><span class="text-xs text-text-secondary">' + E(pr.whyLabel) + '</span><p>' + E(pr.why) + '</p></div>');
    },
    estimate: function (d) {
      var es = d.estimate;
      return card('', head(es.title, es.meta, byAi(d, 'estimate'))
        + '<div class="ad-sizes">' + es.sizes.map(function (z, i) { return '<div class="ad-size' + (i === es.selected ? ' is-on' : '') + '">' + (i === es.selected ? '<span class="ad-pick text-xs">' + E(es.pick) + '</span>' : '') + '<span class="ad-sk">' + E(z.key) + '</span><span class="text-xs text-text-secondary">' + E(z.range) + '</span></div>'; }).join('') + '</div>'
        + '<div class="ad-stats">' + es.stats.map(function (t) { return '<div class="ad-f"><span class="text-xs text-text-secondary">' + E(t.label) + '</span><span class="ad-fv">' + E(t.value) + '</span></div>'; }).join('') + '</div>'
        + '<h3 class="ad-sub text-sm font-medium">' + E(es.compLabel) + '</h3><div class="ad-list">' + es.comps.map(function (c) { return '<div class="ad-as"><span class="ad-li-top"><a class="ac-link text-base" href="#" data-soon="1">' + E(c.title) + '</a><span class="aiux-divider aiux-divider-vertical ac-vd" aria-hidden="true"></span><span class="text-xs text-text-tertiary">' + E(c.ref) + '</span></span><span class="text-sm text-text-secondary">' + E(c.size) + ' · ' + E(c.took) + '</span></div>'; }).join('') + '</div>'
        + '<div class="ad-rs"><span class="text-xs text-text-secondary">' + E(es.reasoningLabel) + '</span><p>' + E(es.reasoning) + '</p></div>');
    },
    impact: function (d) { var im = d.impact; return card('', head(im.title, im.meta, byAi(d, 'impact')) + '<div class="ad-imp">' + im.items.map(function (i) { return '<div class="ad-i"><span class="ad-iv">' + E(i.value) + '</span><span class="text-sm text-text-secondary">' + E(i.label) + '</span></div>'; }).join('') + '</div>'); }
  };

  /* ---------- layout: nothing is drawn until its agent has finished; cards then grow into place ---------- */
  function slot(k, cls) { return '<div class="ad-slot ' + (cls || '') + '" data-slot="' + k + '"></div>'; }
  function rv(k, inner) { return '<div class="ad-rv" data-rv="' + k + '"><div class="ad-rv-i">' + inner + '</div></div>'; }
  function cell(w, inner, open) { return '<div class="ad-cell' + (open ? ' is-open is-settled' : '') + '" style="--w:' + w + '"><div class="ad-cell-i">' + inner + '</div></div>'; }
  function statusBadge(key) { var s = D.states[key]; return '<span id="st" class="aiux-badge aiux-badge-sm aiux-badge-soft aiux-badge-' + s.tone + ' ow-pill">' + E(s.label) + '</span>'; }
  function setStatus(key) { var el = $('st'); if (!el) return; var s = D.states[key]; el.className = 'aiux-badge aiux-badge-sm aiux-badge-soft aiux-badge-' + s.tone + ' ow-pill'; el.textContent = s.label; }

  /* ---------- Track demand: the stage of the demand, moved by the agents ---------- */
  function trackHtml() {
    var t = D.track, parts = [];
    t.steps.forEach(function (n, i) {
      parts.push('<li class="ad-trk-s" data-s="' + i + '"><span class="ad-trk-c"></span><span class="ad-trk-l text-xs">' + E(n) + '</span></li>');
      if (i < t.steps.length - 1) parts.push('<li class="ad-trk-ln" data-ln="' + i + '" aria-hidden="true"></li>');
    });
    return card('ad-trk', '<div class="ad-head"><div><div class="ad-h2"><h2 class="text-base font-medium">' + E(t.title) + '</h2></div><p class="text-xs text-text-secondary" id="trk-h"></p></div>' + bySp(D, 'track') + '</div><ol class="ad-trk-steps">' + parts.join('') + '</ol>'
      + '<div class="ad-trk-box" id="trk-box"><div class="ad-trk-bb" id="trk-bb"></div></div>');
  }
  function boxHtml(done) {
    var t = D.track, c = D.convert, dc = D.decision;
    if (!done) return '<div class="ad-trk-bt"><span class="text-sm font-medium' + (t.hold ? ' ad-trk-hold' : '') + '">' + (t.hold ? '<aiux-icon name="triangle-exclamation-outline" size="sm"></aiux-icon>' : '') + E(t.box.waiting.title) + '</span><span class="text-sm text-text-secondary">' + E(t.box.waiting.sub) + '</span></div>';
    var owner = c.steps[0].opts[0].split(',')[0], start = c.steps[2].opts[0];
    return '<div class="ad-trk-bt"><span class="text-sm font-medium ad-trk-done"><aiux-icon name="circle-check" size="sm"></aiux-icon>' + E(dc.done.title.replace('{num}', c.num)) + '</span><span class="text-sm text-text-secondary">' + E(dc.done.sub.replace('{owner}', owner).replace('{start}', start)) + '</span></div><button class="aiux-btn aiux-btn-sm" data-open="1">' + E(dc.done.cta) + '</button>';
  }
  var stage = 0;
  function swap(el, html, asHtml) {
    var cur = asHtml ? el.innerHTML : el.textContent; if (cur === html) return;
    if (!cur || $('page').classList.contains('is-instant')) { if (asHtml) el.innerHTML = html; else el.textContent = html; return; }
    el.classList.add('is-swap');
    setTimeout(function () { if (asHtml) el.innerHTML = html; else el.textContent = html; el.classList.remove('is-swap'); }, 140);
  }
  function setStage(n) {
    stage = n; var t = D.track, all = n >= 5;
    swap($('trk-h'), t.phases[Math.min(n, 5)]);
    document.querySelectorAll('.ad-trk-s').forEach(function (li) {
      var i = parseInt(li.dataset.s, 10), st = all || i < n ? 'done' : (i === n ? 'cur' : 'todo');
      if (li.dataset.st === st) return;
      li.dataset.st = st; li.className = 'ad-trk-s is-' + st;
      li.querySelector('.ad-trk-c').innerHTML = st === 'done' ? '<aiux-icon name="check-outline" size="sm"></aiux-icon>' : String(i + 1);
    });
    document.querySelectorAll('.ad-trk-ln').forEach(function (l) { l.className = 'ad-trk-ln' + (all || parseInt(l.dataset.ln, 10) < n ? ' is-done' : ''); });
    swap($('trk-bb'), boxHtml(all), true); $('trk-box').classList.toggle('is-done', all);
    var hold = !!(t.hold && n === t.stage); document.querySelector('.ad-trk').classList.toggle('is-hold', hold);
    setStatus(hold ? 'review' : ['submitted', 'submitted', 'screening', 'qualified', 'approved', 'complete'][Math.min(n, 5)]);
  }

  function render(d) {
    var top = '<a class="ad-back text-sm" href="aict.html"><aiux-icon name="chevron-left-outline" size="sm"></aiux-icon>' + E(d.back.label) + '</a>'
      + '<div class="ad-title-row"><div class="ad-title-main"><h1 class="ad-title">' + E(d.title) + '</h1>'
      + '<div class="ad-meta text-sm text-text-secondary">' + statusBadge('submitted') + '<span id="risk"></span><span>' + E(d.ref) + '</span>' + d.meta.map(function (m) { return '<span class="ad-sep"></span><span>' + E(m) + '</span>'; }).join('') + '</div></div>'
      + '<button class="aiux-btn aiux-btn-sm" data-soon="1">' + E(d.actions) + ' <aiux-icon name="chevron-down-outline" size="sm"></aiux-icon></button></div>'
      + '<div class="aiux-tabs aiux-tabs-box ad-tabs" role="tablist">' + d.tabs.map(function (t, i) { return '<button role="tab" class="aiux-tab ' + (i === 0 ? 'aiux-tab-active' : '') + '" ' + (i ? 'data-soon="1"' : '') + '>' + E(t) + '</button>'; }).join('') + '</div>';

    var sm = d.summary;
    var summary = card('', head(sm.title, sm.meta, byAi(d, 'summary'))
      + '<div class="ad-prose"><h3 class="text-sm font-medium">' + E(sm.requirement) + '</h3><p>' + E(sm.body) + '</p></div>'
      + rv('rec', slot('rec', 'ad-slot-rec')));

    $('page').innerHTML = '<div class="ad-top ow-in" style="--d:60ms">' + top + '</div>'
      + '<div class="ad-stack ow-in" style="--d:140ms">'
      + '<div class="ad-trk-wrap">' + trackHtml() + '</div>'
      + rv('top', slot('glance'))
      + '<div class="ad-fx ad-fx-a">' + cell(5, summary, true) + cell(4, slot('similar')) + '</div>'
      + rv('b', '<div class="ad-fx ad-fx-b">' + cell(1, slot('estimate')) + cell(1, slot('prio')) + '</div>')
      + rv('c', '<div class="ad-fx ad-fx-c">'
        + cell(2, rv('policy', slot('policy')) + rv('details', slot('details')))
        + cell(1, rv('assess', slot('assess')) + rv('signals', slot('signals')) + rv('impact', slot('impact')))
        + '</div>')
      + '</div>';
  }

  /* ---------- reveal one card: fill it, then open its row/column so everything below moves down ---------- */
  function openUp(el) {
    var n = el;
    while (n && n.id !== 'page') {
      if (n.classList && (n.classList.contains('ad-rv') || n.classList.contains('ad-cell')) && !n.classList.contains('is-open')) {
        n.classList.add('is-open'); (function (x) { setTimeout(function () { x.classList.add('is-settled'); }, 900); })(n);
      }
      n = n.parentNode;
    }
  }
  function fill(k, animate) {
    var el = document.querySelector('[data-slot="' + k + '"]'); if (!el || el.dataset.done) return;
    el.dataset.done = '1';
