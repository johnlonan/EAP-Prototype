<script>
  // Apply selected persona (URL ?p=, then localStorage, fallback ananya)
  if (EAP.bootPersona) EAP.bootPersona();
  // Persona-scoped data injections — only Ananya gets Otto's draft Feature
  // (the bundle proposal materialised as a Funnel item).
  if (EAP.state.persona === 'ananya' && EAP.injectAnanyaDraftFeature) {
    EAP.injectAnanyaDraftFeature();
  }
  // Carry visit forward so existing screens know which demo session is active.
  // Honour ?tab= from the IH tile click and snap to that tab on first render.
  (function(){
    try {
      var qs = new URLSearchParams(window.location.search);
      var v = qs.get('visit') || localStorage.getItem('eap.visit') || 'return';
      EAP.state.visit = v;
      // ?highlight= deep-link from the IH (e.g. customer-signals callout).
      // Stored on state; consumed by EAP.handleHighlight after first render.
      var hl = qs.get('highlight');
      if (hl) EAP.state.highlight = hl;
      var t = qs.get('tab');
      if (t) {
        var validTabs = (EAP.tabConfig || []).map(function(c){ return c.id; });
        if (validTabs.indexOf(t) !== -1) {
          // Match setTab's contract without triggering its render — the boot
          // path calls EAP.render() once below.
          EAP.state.tab = t;
          EAP.state.wsjfSort = null;
          EAP.state.pagination = {};
          EAP.state.mineOverrides = EAP.state.mineOverrides || {};
          if (EAP.state.mineOverrides[t] !== undefined) {
            EAP.state.mineOnly = EAP.state.mineOverrides[t];
          } else if (typeof EAP.personaWantsMineOn === 'function') {
            EAP.state.mineOnly = EAP.personaWantsMineOn(EAP.personas[EAP.state.persona], t);
          }
          // Task Board needs ART/Team context + WorkItem level
          if (t === 'taskboard') {
            if (EAP.state.context !== 'art' && EAP.state.context !== 'team') {
              EAP.state.context = 'art';
              EAP.state.contextName = 'Digital Banking ART';
              EAP.state.contextId = 'art1';
            }
            EAP.state.level = 'WorkItem';
          }
        }
      }
    } catch(e) {}
  })();
  // Render nav with the active persona's avatar + name
  var __p = (EAP.personas && EAP.personas[EAP.state.persona]) || (EAP.personas && EAP.personas.ananya) || {};
  // Preserve persona + visit on home-nav clicks so internal navigation doesn't bounce back to start
  var __carry = '?p=' + (EAP.state.persona || 'ananya') + (EAP.state.visit ? '&visit=' + EAP.state.visit : '');
  var __homeUrl = 'home.html' + __carry;
  renderNav('board', {
    avatar: __p.avatar || '../../assets/images/avatar-miley-simmons.png',
    name:   __p.name   || 'Ananya Krishnan',
    links:  { 0: __homeUrl, 2: 'setup.html', 3: 'index.html' + __carry + '&tab=board' },
    theme:  'sand'
  });
  if (EAP.initPersonaSwitcher) EAP.initPersonaSwitcher();
  EAP.state.openAccordions['pi26'] = true;
  EAP.initInteractions();
  EAP.render();

  // ── Otto context banner (deep-link from IH Otto interactions) ──
  // When landing from the home page via an Otto item, ?otto= carries the
  // context message explaining why the user is here and what to look at.
  (function() {
    try {
      var qs = new URLSearchParams(window.location.search);
      var ottoMsg = qs.get('otto');
      if (!ottoMsg) return;
      var banner = document.createElement('div');
      banner.id = 'otto-banner';
      banner.innerHTML =
        '<span class="otto-banner-sparkle">' + EAP.icon('otto', 14) + '</span>' +
        '<span class="otto-banner-label">Otto</span>' +
        '<span class="otto-banner-sep">·</span>' +
        '<span class="otto-banner-msg">' + ottoMsg + '</span>' +
        '<button class="otto-banner-close" aria-label="Dismiss">&#x2715;</button>';
      var filterBar = document.getElementById('filter-bar');
      var vp = document.querySelector('.content-viewport');
      if (!vp) return;
      if (filterBar) {
        vp.insertBefore(banner, filterBar);
      } else {
        var gpanel = document.getElementById('gpanel');
        if (gpanel) vp.insertBefore(banner, gpanel); else vp.appendChild(banner);
      }
      requestAnimationFrame(function() {
        requestAnimationFrame(function() { banner.classList.add('show'); });
      });
      var timer = setTimeout(dismiss, 9000);
      function dismiss() {
        banner.classList.remove('show');
        setTimeout(function() { if (banner.parentNode) banner.parentNode.removeChild(banner); }, 400);
      }
      banner.querySelector('.otto-banner-close').addEventListener('click', function() {
        clearTimeout(timer); dismiss();
      });
    } catch(e) {}
  })();

  // ── Deep-link highlight ──────────────────────────────
  // The IH (customer-signals callout) deep-links into Backlog with the
  // bundled draft Feature targeted via ?highlight=fb1. After first render:
  //  1. scroll the row into view
  //  2. apply .is-highlighted (sticks until first interaction)
  //  3. open the detail panel after a short pause so the row pulse reads
  if (EAP.state.highlight) {
    var __hlId = EAP.state.highlight;
    requestAnimationFrame(function() {
      var row = document.querySelector('tr[data-item-id="' + __hlId + '"]');
      if (!row) return;
      row.classList.add('is-highlighted');
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      // Auto-open detail after the pulse establishes itself
      setTimeout(function() {
        if (EAP.openDetail) EAP.openDetail(__hlId);
      }, 700);
      // Stick until first interaction — clear on scroll, click, or keypress
      var clear = function() {
        row.classList.remove('is-highlighted');
        document.removeEventListener('click',  clear, true);
        document.removeEventListener('keydown',clear, true);
        var sc = document.querySelector('.gpanel-scroll'); if (sc) sc.removeEventListener('scroll', clear, true);
      };
      document.addEventListener('click',  clear, true);
      document.addEventListener('keydown',clear, true);
      var sc = document.querySelector('.gpanel-scroll'); if (sc) sc.addEventListener('scroll', clear, true);
    });
  }
</script>

<!-- ══════════════════════════════════════════════════════════════
     AI INTAKE ASSISTANT — N7 Setup UX prototype
     Wires the "New" button in Backlog/List tabs to an AI-assisted
     feature/story creation panel. Otto suggests team, PI, effort,
     and similar existing items before the user even saves.

        <div class="aim-type-pill" id="aim-type-pill">Feature</div>

      </div>

    </div>

      <!-- Title input -->
      <div class="aim-field">
        <input class="aim-title-input" id="aim-title-input" type="text"
          placeholder="Feature title…"
          autocomplete="off" spellcheck="false">
      </div>

      <!-- Description -->
      <div class="aim-field">
        <textarea class="aim-desc-input" id="aim-desc-input" rows="3"
          placeholder="Optional description — Otto uses this to improve suggestions"></textarea>
      </div>

      <!-- AI suggestions panel -->

        </div>
        <div class="aim-suggestions" id="aim-suggestions" style="display:none">

        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="aim-footer">
      <button class="aim-btn-cancel" id="aim-btn-cancel">Cancel</button>
      <button class="aim-btn-create" id="aim-btn-create" disabled>Create Feature</button>
    </div>
  </div>
</div>

<script>
// ── AI Intake Assistant ────────────────────────────────────────────
(function() {

  var overlay  = document.getElementById('ai-intake-overlay');
  var modal    = document.getElementById('ai-intake-modal');
  var titleIn  = document.getElementById('aim-title-input');
  var descIn   = document.getElementById('aim-desc-input');
  var typePill = document.getElementById('aim-type-pill');
  var aiPanel  = document.getElementById('aim-ai-panel');
  var spinner  = document.getElementById('aim-ai-spinner');
  var aiLabel  = document.getElementById('aim-ai-label');
  var aiDismiss= document.getElementById('aim-ai-dismiss');
  var suggestions= document.getElementById('aim-suggestions');
  var btnCreate= document.getElementById('aim-btn-create');
  var sugTimer, titleTimer;

  // Build suggestions based on current state
  function getSuggestionsForLevel(level) {
    if (level === 'WorkItem') {
      return [
        {
          icon: '✦', label: 'Suggested team', value: 'Auth Team',
          note: 'Based on similar work items in Sprint 2', confidence: '91%'
        },
        {
          icon: '✦', label: 'Suggested sprint', value: 'Sprint 2 (active)',
          note: 'PI-26 · ends in 7 days', confidence: '88%'
        },
        {
          icon: '✦', label: 'Effort estimate', value: '3 story points',
          note: 'Median for Auth Team items this PI', confidence: '76%'
        },
        {
          icon: '✦', label: 'Similar work items', value: null,
          similar: [
            { id: 'SI-247', title: 'Add MFA token refresh flow' },
            { id: 'SI-201', title: 'Session timeout handling on mobile' }
          ]
        }
      ];
    }
    // Feature / default
    return [
      {
        icon: '✦', label: 'Suggested ART team', value: 'Auth Team',
        note: 'Matches auth domain — 3 similar features owned by this team', confidence: '87%'
      },
      {
        icon: '✦', label: 'Suggested PI', value: 'PI-26 (current)',
        note: 'Based on backlog priority and team capacity', confidence: '82%'
      },
      {
        icon: '✦', label: 'Effort estimate', value: '8 story points',
        note: 'Median for auth-domain features this PI', confidence: '74%'
      },
      {
        icon: '✦', label: 'Similar features', value: null,
        similar: [
          { id: 'F-112', title: 'Biometric login for iOS & Android' },
          { id: 'F-098', title: 'OAuth 2.0 PKCE flow for web' },
          { id: 'F-071', title: 'Session persistence after app backgrounding' }
        ]
      }
    ];
  }

  function renderSuggestions(level) {
    var sugs = getSuggestionsForLevel(level);
    suggestions.innerHTML = '';
    sugs.forEach(function(s, i) {
      var el = document.createElement('div');
      el.className = 'aim-sug';
      el.style.animationDelay = (i * 80) + 'ms';

      if (s.similar) {
        el.innerHTML = '<span class="aim-sug-icon">' + s.icon + '</span>' +
          '<div class="aim-sug-body">' +
            '<div class="aim-sug-label">' + s.label + '</div>' +
            '<div class="aim-similar-list">' +
              s.similar.map(function(item) {
                return '<div class="aim-similar-item">' +
                  '<span class="aim-similar-id">' + item.id + '</span>' +
                  item.title +
                '</div>';
              }).join('') +
            '</div>' +
          '</div>';
      } else {
        el.innerHTML = '<span class="aim-sug-icon">' + s.icon + '</span>' +
          '<div class="aim-sug-body">' +
            '<div class="aim-sug-label">' + s.label + '</div>' +
            '<div class="aim-sug-value">' + s.value + '</div>' +
            (s.note ? '<div class="aim-sug-note">' + s.note + '</div>' : '') +
          '</div>' +
          (s.confidence ? '<div class="aim-sug-confidence">✦ ' + s.confidence + '</div>' : '') +
          '<button class="aim-sug-accept" title="Apply suggestion">Apply</button>';

        var acceptBtn = el.querySelector('.aim-sug-accept');
        if (acceptBtn) {
          acceptBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            acceptBtn.textContent = '✓ Applied';
            acceptBtn.classList.add('is-accepted');
            acceptBtn.disabled = true;
          });
        }
      }
      suggestions.appendChild(el);
    });
  }

  function runAiSuggestions(level) {
    spinner.classList.remove('is-done');
    aiLabel.textContent = 'Otto is generating suggestions…';
    aiDismiss.style.display = 'none';
    suggestions.style.display = 'none';
    suggestions.innerHTML = '';

    sugTimer = setTimeout(function() {
      spinner.classList.add('is-done');
      aiLabel.textContent = '✦ Suggestions ready — review before saving';
      aiDismiss.style.display = 'block';
      renderSuggestions(level);
      suggestions.style.display = 'flex';
    }, 1400);
  }

  function openIntake() {
    var level = (EAP && EAP.state) ? EAP.state.level : 'Feature';
    var typeLabel = level === 'WorkItem' ? 'Story' : (level || 'Feature');
    typePill.textContent = typeLabel;
    btnCreate.textContent = 'Create ' + typeLabel;
    btnCreate.disabled = true;
    titleIn.value = '';
    descIn.value = '';
    spinner.classList.remove('is-done');
    aiLabel.textContent = 'Otto is generating suggestions…';
    aiDismiss.style.display = 'none';
    suggestions.style.display = 'none';

    overlay.style.display = 'flex';
    requestAnimationFrame(function() {
      titleIn.focus();
      runAiSuggestions(level);
    });
  }

  function closeIntake() {
    if (sugTimer) clearTimeout(sugTimer);
    if (titleTimer) clearTimeout(titleTimer);
    overlay.style.animation = 'none';
    modal.style.animation = 'none';
    overlay.style.opacity = '0';
    setTimeout(function() {
      overlay.style.display = 'none';
      overlay.style.opacity = '';
      overlay.style.animation = '';
      modal.style.animation = '';
    }, 160);
  }

  // Enable create button when title is entered
  titleIn.addEventListener('input', function() {
    btnCreate.disabled = !titleIn.value.trim();
    clearTimeout(titleTimer);
    if (titleIn.value.trim().length > 5) {
      titleTimer = setTimeout(function() {
        var level = (EAP && EAP.state) ? EAP.state.level : 'Feature';
        runAiSuggestions(level);
      }, 700);
    }
  });

  // Close handlers
  document.getElementById('aim-close').addEventListener('click', closeIntake);
  document.getElementById('aim-btn-cancel').addEventListener('click', closeIntake);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeIntake(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.style.display !== 'none') closeIntake();
  });

  // Dismiss suggestions
  aiDismiss.addEventListener('click', function() {
    aiPanel.style.display = 'none';
  });

  // Create (simulated — logs to console in prototype)
  btnCreate.addEventListener('click', function() {
    if (!titleIn.value.trim()) return;
    var level = (EAP && EAP.state) ? EAP.state.level : 'Feature';
    console.log('[N7 AI Intake] Creating ' + level + ':', titleIn.value.trim());
    closeIntake();
  });

  // Delegate: wire "New" button from backlog/list tab
  // render.js re-renders the DOM on tab switch, so use document-level delegation
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.add-btn');
    if (!btn) return;
    // Only intercept "New" buttons — other add-btns (Expand all, Collapse all, etc.) must pass through
    var txt = btn.textContent || btn.innerText || '';
    if (txt.indexOf('New') !== -1) {
      e.stopPropagation();
      openIntake();
    }
  }, true); // capture phase so it fires before render.js's handler

})();
</script>
</body>
</html>
