  <style>
    /* ── Page-specific overrides ─────────────────────── */
    body {
      background: linear-gradient(135deg, #E5EDF0 0%, #DCE8F0 50%, #E4EDF5 100%) !important;
    }

    /* ── PI selector ───────────────────────────────── */
    #pi-selector:focus {
      outline: 2px solid var(--color-primary);
      outline-offset: 1px;
    }

    /* ── Glass panel ────────────────────────────────── */
    .glass-panel {
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── WSJF tooltip ───────────────────────────────── */
    .wsjf-tip {
      position: relative;
      cursor: help;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 1px dashed var(--border-default);
      display: inline-block;
    }
    .wsjf-tip:hover::after,
    .wsjf-tip.tooltip-demo::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 16px;
      background: var(--color-neutral);
      color: white;
      border-radius: var(--radius-field);
      font-size: 11px;
      font-weight: 400;
      white-space: pre-line;
      z-index: 100;
      width: 200px;
      text-align: left;
      line-height: 1.7;
      box-shadow: var(--shadow-lg);
      pointer-events: none;
    }
    .wsjf-tip:hover::before,
    .wsjf-tip.tooltip-demo::before {
      content: '';
      position: absolute;
      top: calc(100% + 2px);
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-bottom-color: var(--color-neutral);
      z-index: 100;
    }
    .wsjf-tip.tooltip-demo::after {
      animation: tooltipFade 3.5s ease forwards;
    }
    .wsjf-tip.tooltip-demo::before {
      animation: tooltipFade 3.5s ease forwards;
    }
    @keyframes tooltipFade {
      0% { opacity:0; }
      10% { opacity:1; }
      75% { opacity:1; }
      100% { opacity:0; }
    }

    /* ── Feature table ──────────────────────────────── */
    #feature-tbody tr {
      border-bottom: 1px solid rgba(0,0,0,0.04);
      transition: background var(--transition-fast);
    }
    #feature-tbody tr:hover {
      background: var(--color-ghost-hover);
    }
    #feature-tbody tr:hover .stage-btn {
      opacity: 1;
    }
    #feature-tbody tr.row-at-risk {
      border-left: 4px solid #E07A5F;
      background: rgba(224,122,95,0.06);
    }
    #feature-tbody tr.row-blocked {
      border-left: 4px solid #CC0000;
      background: rgba(204,0,0,0.06);
    }
    #feature-tbody tr.row-needs-scoring,
    #feature-tbody tr.row-no-estimate {
      border-left: 4px solid #D97706;
      background: rgba(217,119,6,0.05);
    }

    /* ── Status pills ───────────────────────────────── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── Stage button (appears on hover) ────────────── */
    .stage-btn {
      opacity: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.15);
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }
    .stage-btn:hover {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: white;
    }
    .stage-btn svg { pointer-events: none; }

    /* ── Progress bar (PI-25 rows) ──────────────────── */
    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--color-secondary);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ── Capacity bar ───────────────────────────────── */
    .capacity-track {
      position: relative;
      height: 10px;
      background: var(--color-secondary);
      border-radius: 5px;
      overflow: visible;
    }
    .capacity-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.5s ease;
      background: rgba(42,110,220,0.35);
    }
    .capacity-marker {
      position: absolute;
      top: -2px;
      width: 1px;
      height: 14px;
    }

    /* ── Staged item ────────────────────────────────── */
    .staged-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(42,110,220,0.04);
      border-radius: var(--radius-lg);
      font-size: 12px;
      color: var(--text-primary);
      gap: 8px;
      transition: all var(--transition-fast);
    }
    .staged-item:hover {
      background: rgba(42,110,220,0.08);
    }
    .unstage-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }
    .unstage-btn:hover {
      background: rgba(224,122,95,0.12);
      color: #E07A5F;
    }

    /* ── Side panel summary dots ─────────────────────── */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Scrollbar for panels ────────────────────────── */
    .glass-panel ::-webkit-scrollbar { width: 3px; }
    .glass-panel ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

    /* ── Checkbox for drag handle column ─────────────── */
    .drag-handle {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-disabled);
      cursor: grab;
    }
  </style>
</head>

    // ═══════════════════════════════════════════════════════
    // STAGING
    // ═══════════════════════════════════════════════════════

    function stageFeature(featureId) {
      if (stagedFeatures.indexOf(featureId) === -1) {
        stagedFeatures.push(featureId);
      }
      renderFeatures(currentBacklogPI);
      renderSidePanel(currentBacklogPI);
    }

    function unstageFeature(featureId) {
      stagedFeatures = stagedFeatures.filter(function(id) { return id !== featureId; });
      renderFeatures(currentBacklogPI);
      renderSidePanel(currentBacklogPI);
    }

    function getStagedWSJFTotal() {
      var total = 0;
      stagedFeatures.forEach(function(id) {
        pi26Features.forEach(function(f) {
          if (f.id === id) total += f.wsjf;
        });
      });
      return total;
    }

    function renderStagingPanel(panel) {

      html += '  </button>';
      html += '</div>';

      panel.innerHTML = html;
    }

    function renderSummaryPanel(panel) {
      // Count statuses
      var counts = {'on-track':0, 'at-risk':0, 'blocked':0, 'not-started':0, 'complete':0};
      var teamMap = {};
      var atRiskBV = 0;
      pi25Features.forEach(function(f) {
        if (counts[f.status] !== undefined) counts[f.status]++;
        if (!teamMap[f.team]) teamMap[f.team] = [];
        teamMap[f.team].push(f);
        if (f.status === 'at-risk' || f.status === 'blocked') {
          atRiskBV += f.wsjfParts[0]; // business value component
        }
      });

      var html = '';
      // Sticky header
      html += '<div style="padding:16px 20px; border-bottom:1px solid rgba(0,0,0,0.06); flex-shrink:0;">';
      html += '  <div style="display:flex; align-items:center; gap:8px;">';
      html += '    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>';
      html += '    <span style="font-size:14px; font-weight:500;">PI-25 summary</span>';
      html += '  </div>';
      html += '</div>';

      // Scrollable body
      html += '<div style="flex:1; overflow-y:auto;">';

      // Status breakdown
      html += '<div style="padding:16px 20px;">';
      html += '  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">';
      html += '    <span style="font-size:11px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.06em;">Feature status</span>';
      html += '    <span id="clear-filter-top" style="display:none; font-size:10px; font-weight:500; color:var(--color-link); background:var(--color-info-content); padding:2px 8px; border-radius:var(--radius-full); cursor:pointer;" onclick="filterByStatus(\'all\')">Clear filter ×</span>';
      html += '  </div>';
      html += '  <div style="display:flex; flex-direction:column; gap:8px;">';

      var statusOrder = [
        {key:'on-track', label:'On track', color:'#5B9A6F'},
        {key:'complete', label:'Complete', color:'#5B9A6F'},
        {key:'at-risk', label:'At risk', color:'#E07A5F'},
        {key:'blocked', label:'Blocked', color:'#CC0000'},
        {key:'not-started', label:'Not started', color:'var(--text-disabled)'},
      ];

      statusOrder.forEach(function(s) {
        if (counts[s.key] > 0) {
          html += '<div data-filter-status="' + s.key + '" style="display:flex; align-items:center; gap:10px; cursor:pointer; padding:4px 0; border-radius:var(--radius-lg); transition:all var(--transition-fast);" onclick="filterByStatus(\'' + s.key + '\')" onmouseover="this.style.background=\'rgba(0,0,0,0.03)\'" onmouseout="this.style.background=\'transparent\'">';
          html += '  <div class="status-dot" style="background:' + s.color + ';"></div>';
          html += '  <span style="font-size:12px; color:var(--text-secondary); flex:1;">' + s.label + '</span>';
          html += '  <span style="font-size:13px; font-weight:600; color:var(--text-primary);">' + counts[s.key] + '</span>';
          html += '</div>';
        }
      });

      html += '  </div>';
      html += '</div>';

      // At-risk value callout
      html += '<div style="margin:0 20px 16px; padding:12px 14px; background:rgba(224,122,95,0.06); border:1px solid rgba(224,122,95,0.15); border-radius:var(--radius-field);">';
      html += '  <div style="display:flex; align-items:baseline; gap:6px;">';
      html += '    <span style="font-size:20px; font-weight:700; color:#E07A5F;">' + atRiskBV + '</span>';
      html += '    <span style="font-size:12px; color:#E07A5F;">Value at risk</span>';
      html += '  </div>';
      html += '  <div style="font-size:11px; color:var(--text-tertiary); margin-top:4px;">From ' + (counts['at-risk'] + counts['blocked']) + ' Features requiring attention</div>';
      html += '</div>';

      // Team assignments
      html += '<div style="padding:0 20px 20px; flex:1; overflow-y:auto;">';
      html += '  <div style="font-size:11px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px;">Team assignments</div>';
      html += '  <div style="display:flex; flex-direction:column; gap:6px;">';

      var teamNames = Object.keys(teamMap).sort();
      teamNames.forEach(function(team) {
        var features = teamMap[team];
        var hasRisk = features.some(function(f) { return f.status === 'at-risk' || f.status === 'blocked'; });
        var borderColor = hasRisk ? 'rgba(224,122,95,0.3)' : 'rgba(0,0,0,0.04)';
        html += '<div style="padding:10px 12px; background:rgba(255,255,255,0.6); border:1px solid ' + borderColor + '; border-radius:var(--radius-lg);">';
        html += '  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">';
        html += '    <span style="font-size:12px; font-weight:500; color:var(--text-primary);">' + team + '</span>';
        html += '    <span style="font-size:11px; color:var(--text-tertiary);">' + features.length + ' Features</span>';
        html += '  </div>';
        html += '  <div style="display:flex; gap:4px; flex-wrap:wrap;">';
        features.forEach(function(f) {
          var dotSt = statusStyles[f.status] || statusStyles['not-started'];
          html += '<span style="display:inline-flex; align-items:center; gap:3px; font-size:10px; color:var(--text-tertiary); padding:1px 6px; background:rgba(0,0,0,0.03); border-radius:var(--radius-full);">';
          html += '  <span style="width:5px; height:5px; border-radius:50%; background:' + dotSt.color + '; flex-shrink:0;"></span>';
          html += '  ' + f.id;
          html += '</span>';
        });
        html += '  </div>';
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';

      html += '</div>'; // close scrollable body

      panel.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════════
    // FIND FEATURE HELPER
    // ═══════════════════════════════════════════════════════

    function findFeature(id, pi) {
      var features = pi === 'pi-24' ? pi24Features : pi === 'pi-25' ? pi25Features : pi26Features;
      for (var i = 0; i < features.length; i++) {
        if (features[i].id === id) return features[i];
      }
      return null;
    }

    // ═══════════════════════════════════════════════════════
    // PI SWITCHING
    // ═══════════════════════════════════════════════════════

    function switchBacklogPI(pi) {
      currentBacklogPI = pi;

      // Sync dropdown
      var sel = document.getElementById('pi-selector');
      if (sel) sel.value = pi;

      // Reset staging when switching away from PI-26
      if (pi !== 'pi-26') {
        stagedFeatures = [];
      }

      renderFeatures(pi);
      renderSidePanel(pi);

      // Pre-stage top Features for PI-26 to match home screen state
      if (pi === 'pi-26') {
        preStagePI26();
      }

      var titles = { 'all':'Full Backlog', 'pi-23':'Features', 'pi-24':'Features', 'pi-25':'Features', 'pi-26':'Features', 'pi-27':'Features' };
      var contexts = {
        'all': 'All Features across all PIs \u00b7 ' + ((pi24Features?pi24Features.length:0) + (pi25Features?pi25Features.length:0) + (pi26Features?pi26Features.length:0)) + ' total',
        'pi-23': 'PI-23 \u00b7 Closed \u00b7 Jul \u2013 Sep 2025',
        'pi-24': 'PI-24 \u00b7 Closed \u00b7 Oct \u2013 Dec 2025',
        'pi-25': 'PI-25 \u00b7 Active \u00b7 Sprint 3 of 5 \u00b7 37 days remaining',
        'pi-26': 'PI-26 \u00b7 Planning \u00b7 PI Planning in 12 days',
        'pi-27': 'PI-27 \u00b7 Future \u00b7 Not yet planned',
      };
      var insights = {
        'all': 'Showing all Features across PI-24, PI-25, and PI-26. Use search to find specific Features or switch to a PI for contextual views.',
        'pi-23': 'PI-23: Historical data. This PI closed in Sep 2025 with 82% predictability.',
        'pi-24': 'PI-24 delivered 12 of 14 Features. Predictability: 86%. 2 Features carried forward to PI-25.',
        'pi-25': 'PI-25: Reporting module API and Real-time pipeline at risk. Nova over-committed at 109%. 34 business value points exposed.',
        'pi-26': 'PI-26: 3 Features missing WSJF scores. 4 have no estimate. Backlog must be finalised by Apr 15 \u2014 5 working days.',
        'pi-27': 'PI-27: Future PI. Planning has not started yet.',
      };

      document.getElementById('page-title').textContent = titles[pi] || 'Features';
      document.getElementById('pi-context').textContent = contexts[pi] || '';
      document.getElementById('backlog-insight').textContent = insights[pi] || '';

      var createBtnLabel = document.getElementById('create-btn');
      if (createBtnLabel) createBtnLabel.textContent = pi === 'pi-25' ? 'Add Feature' : 'Create Feature';
    }

    // Pre-stage for PI-26 (AFTER table has rendered)
    function preStagePI26() {
      stagedFeatures = [];
      var ids = ['F-28','F-26','F-21','F-23'];
      ids.forEach(function(id) {
        for (var i = 0; i < pi26Features.length; i++) {
          if (pi26Features[i].id === id) {
            stagedFeatures.push(id);
            break;
          }
        }
      });
      renderSidePanel('pi-26');
      // Re-render features so buttons reflect staged state
      renderFeatures('pi-26');
    }

    // ═══════════════════════════════════════════════════════
    // SEARCH / FILTER
    // ═══════════════════════════════════════════════════════

    function filterFeatures() {
      var q = document.getElementById('global-search') ? document.getElementById('global-search').value.toLowerCase() : '';
      var rows = document.querySelectorAll('#feature-tbody tr');
      var visibleCount = 0;
      rows.forEach(function(row) {
        var text = row.textContent.toLowerCase();
        var visible = text.indexOf(q) !== -1;
        row.style.display = visible ? '' : 'none';
        if (visible) visibleCount++;
      });
      var features = currentBacklogPI === 'pi-24' ? pi24Features : currentBacklogPI === 'pi-26' ? pi26Features : pi25Features;
      document.getElementById('feature-count').textContent = (q ? visibleCount + ' of ' : '') + features.length + ' Features';
    }

    function globalSearch() {
      var q = document.getElementById('global-search').value.toLowerCase();
      if (!q) {
        renderFeatures(currentBacklogPI);
        return;
      }
      // Search across all PIs
      var allFeatures = [].concat(pi24Features || [], pi25Features || [], pi26Features || []);
      var matches = allFeatures.filter(function(f) {
        return f.name.toLowerCase().includes(q) || f.id.toLowerCase().includes(q) || (f.cap && f.cap.toLowerCase().includes(q));
      });

      var tbody = document.getElementById('feature-tbody');
      if (matches.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="padding:40px 20px; text-align:center; color:var(--text-disabled); font-size:13px;">No Features matching "' + q.replace(/</g,'&lt;') + '"</td></tr>';
        document.getElementById('feature-count').textContent = '0 Features';
        return;
      }

      tbody.innerHTML = '';
      document.getElementById('feature-count').textContent = matches.length + ' Features (across all PIs)';
      matches.forEach(function(f) {
        // Determine which PI this feature belongs to
        var piLabel = '';
        if (pi24Features && pi24Features.includes(f)) piLabel = 'PI-24';
        else if (pi25Features && pi25Features.includes(f)) piLabel = 'PI-25';
        else if (pi26Features && pi26Features.includes(f)) piLabel = 'PI-26';

        var st = statusStyles[f.status] || statusStyles['not-started'];
        var pColor = progressColors[f.status] || 'var(--text-disabled)';

        var tr = document.createElement('tr');
        tr.style.cssText = 'border-bottom:1px solid rgba(0,0,0,0.04); cursor:pointer; transition:background 0.15s ease;';
        tr.onmouseenter = function() { this.style.background = 'var(--color-ghost-hover)'; };
        tr.onmouseleave = function() { this.style.background = 'transparent'; };
        tr.innerHTML =
          '<td style="padding:10px 8px; text-align:center; color:var(--text-disabled);"><span style="font-size:10px; padding:1px 6px; background:var(--bg-tertiary); border-radius:var(--radius-full); color:var(--text-tertiary);">' + piLabel + '</span></td>' +
          '<td style="padding:10px 8px; text-align:center; font-size:13px; font-weight:600; color:var(--text-primary);">' + f.rank + '</td>' +
          '<td style="padding:10px 12px;"><div style="font-size:13px; color:var(--color-link);">' + f.name + '</div><div style="font-size:11px; color:var(--text-tertiary);">' + f.id + ' \u00b7 ' + (f.cap || '') + '</div></td>' +
          '<td style="padding:10px 4px; text-align:center;"><span style="font-size:13px; font-weight:600;">' + (f.wsjf || '\u2014') + '</span></td>' +
          '<td style="padding:10px 8px;"><span style="font-size:11px; font-weight:500; padding:2px 8px; border-radius:9999px; background:' + st.bg + '; color:' + st.color + ';">' + st.label + '</span></td>' +
          '<td style="padding:10px 8px; font-size:12px; color:var(--text-secondary);">' + (f.team || 'TBD') + '</td>' +
          '<td style="padding:10px 8px;"><div style="display:flex; align-items:center; gap:6px;"><div style="width:60px; height:5px; background:var(--color-secondary); border-radius:3px; overflow:hidden;"><div style="width:' + f.progress + '%; height:100%; background:' + (f.progress >= 50 ? '#5B9A6F' : f.progress >= 25 ? '#D97706' : f.progress > 0 ? '#E07A5F' : 'var(--color-secondary)') + '; border-radius:3px;"></div></div><span style="font-size:10px; color:var(--text-tertiary);">' + f.progress + '%</span></div></td>' +
          '<td style="padding:10px 4px; text-align:center;">' + (f.signals > 0 ? '<span style="font-size:10px; font-weight:600; padding:1px 6px; border-radius:var(--radius-full); background:var(--color-info-content); color:var(--color-info);">' + f.signals + '</span>' : '') + '</td>' +
          '<td></td>';
        tbody.appendChild(tr);
      });
    }

    // ═══════════════════════════════════════════════════════
    // STATUS FILTER (from side panel clicks)
    // ═══════════════════════════════════════════════════════

    function filterByStatus(status) {
      var rows = document.querySelectorAll('#feature-tbody tr');
      var visibleCount = 0;
      rows.forEach(function(row) {
        if (status === 'all') { row.style.display = ''; visibleCount++; return; }
        var match = row.getAttribute('data-status') === status;
        row.style.display = match ? '' : 'none';
        if (match) visibleCount++;
      });
      var features = currentBacklogPI === 'pi-24' ? pi24Features : currentBacklogPI === 'pi-26' ? pi26Features : pi25Features;
      document.getElementById('feature-count').textContent = (status !== 'all' ? visibleCount + ' of ' : '') + features.length + ' Features';
      // Show/hide clear filter pill
      var clearTop = document.getElementById('clear-filter-top');
      if (clearTop) clearTop.style.display = status === 'all' ? 'none' : 'inline-block';
      // Dim non-active status items in the sidebar
      document.querySelectorAll('[data-filter-status]').forEach(function(item) {
        if (status === 'all') {
          item.style.opacity = '1';
        } else {
          item.style.opacity = item.getAttribute('data-filter-status') === status ? '1' : '0.3';
        }
      });
    }

    // ═══════════════════════════════════════════════════════
    // INIT — read PI from URL param or default to pi-25
    // ═══════════════════════════════════════════════════════
    (function() {
      var params = new URLSearchParams(window.location.search);
      var pi = params.get('pi');

      // Show/hide back button based on referrer
      if (!params.get('from')) {
        var backBtn = document.getElementById('back-btn');
        var breadcrumb = document.getElementById('breadcrumb');
        if (backBtn) backBtn.style.display = 'none';
        if (breadcrumb) breadcrumb.style.display = 'none';
      }

      if (pi && ['pi-23','pi-24','pi-25','pi-26','pi-27'].includes(pi)) {
        switchBacklogPI(pi);
      } else {
        // Default to active PI when arriving directly
        switchBacklogPI('pi-25');
      }
      // Sync dropdown to current PI
      var sel = document.getElementById('pi-selector');
      if (sel) sel.value = currentBacklogPI;

      // Teach the user about WSJF tooltips — briefly show one
      setTimeout(function() {
        var firstTip = document.querySelector('.wsjf-tip');
        if (firstTip) {
          firstTip.classList.add('tooltip-demo');
          setTimeout(function() {
            firstTip.classList.remove('tooltip-demo');
          }, 3500);
        }
      }, 800);
    })();
  </script>
</body>
