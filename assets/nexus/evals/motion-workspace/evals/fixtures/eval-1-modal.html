<!-- Modal component — currently uses display:none with no transition -->
<!-- Task: add a proper fade-in/out animation when the modal opens and closes -->

<div
  id="modal-backdrop"
  class="fixed inset-0 bg-black/50 hidden"
  data-state="closed"
>
  <div
    id="modal"
    class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-base-100 rounded-xl shadow-xl p-6 w-[480px] hidden"
    role="dialog"
    aria-modal="true"
  >
    <h2 class="text-lg font-semibold mb-4">Confirm action</h2>
    <p class="text-base-content/70 mb-6">Are you sure you want to continue?</p>
    <div class="flex justify-end gap-3">
      <button id="cancel-btn" class="btn btn-ghost">Cancel</button>
      <button id="confirm-btn" class="btn btn-primary">Confirm</button>
    </div>
  </div>
</div>

<script>
  const backdrop = document.getElementById('modal-backdrop');
  const modal = document.getElementById('modal');
  const cancelBtn = document.getElementById('cancel-btn');

  function openModal() {
    backdrop.classList.remove('hidden');
    modal.classList.remove('hidden');
  }

  function closeModal() {
    backdrop.classList.add('hidden');
    modal.classList.add('hidden');
  }

  cancelBtn.addEventListener('click', closeModal);
</script>
