<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Grid — No Stagger</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 p-8">
    <h1 class="text-xl font-semibold mb-6">Recent Items</h1>

    <!--
    PROBLEM: All 6 cards pop in simultaneously with no animation when the
    grid loads. There is no stagger — no per-item delay, no fade-in, nothing.
    Task: add a stagger entrance animation so cards cascade in one by one.
  -->
    <div id="card-grid" class="grid grid-cols-3 gap-4">
      <div
        id="card-1"
        class="bg-white rounded-lg p-4 shadow-sm border border-gray-200"
      >
        <div class="text-sm font-medium text-gray-900">Incident INC001</div>
        <div class="text-xs text-gray-500 mt-1">P2 · Assigned to Alice</div>
      </div>
      <div
        id="card-2"
        class="bg-white rounded-lg p-4 shadow-sm border border-gray-200"
      >
        <div class="text-sm font-medium text-gray-900">Incident INC002</div>
        <div class="text-xs text-gray-500 mt-1">P1 · Unassigned</div>
      </div>
      <div
        id="card-3"
        class="bg-white rounded-lg p-4 shadow-sm border border-gray-200"
      >
        <div class="text-sm font-medium text-gray-900">Incident INC003</div>
        <div class="text-xs text-gray-500 mt-1">P3 · Assigned to Bob</div>
      </div>
      <div
        id="card-4"
        class="bg-white rounded-lg p-4 shadow-sm border border-gray-200"
      >
        <div class="text-sm font-medium text-gray-900">Incident INC004</div>
        <div class="text-xs text-gray-500 mt-1">P2 · Resolved</div>
      </div>
      <div
        id="card-5"
        class="bg-white rounded-lg p-4 shadow-sm border border-gray-200"
      >
        <div class="text-sm font-medium text-gray-900">Incident INC005</div>
        <div class="text-xs text-gray-500 mt-1">P1 · In Progress</div>
      </div>
      <div
        id="card-6"
        class="bg-white rounded-lg p-4 shadow-sm border border-gray-200"
      >
        <div class="text-sm font-medium text-gray-900">Incident INC006</div>
        <div class="text-xs text-gray-500 mt-1">P3 · New</div>
      </div>
    </div>
  </body>
</html>
