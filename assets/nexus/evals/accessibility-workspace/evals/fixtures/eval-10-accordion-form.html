<div class="form-accordion">
  <div class="section">
    <div class="section-header" onclick="toggleSection(this)">
      Personal Info <span class="icon">&#x25BC;</span>
    </div>
    <div class="section-content">
      <label>First Name: <input type="text" /></label>
      <label>Last Name: <input type="text" /></label>
    </div>
  </div>

  <div class="section">
    <div class="section-header" onclick="toggleSection(this)">
      Address <span class="icon">&#x25BC;</span>
    </div>
    <div class="section-content" style="display: none">
      <label>Street: <input type="text" /></label>
      <label>City: <input type="text" /></label>
    </div>
  </div>

  <div class="section">
    <div class="section-header" onclick="toggleSection(this)">
      Preferences <span class="icon">&#x25BC;</span>
    </div>
    <div class="section-content" style="display: none">
      <label>Newsletter: <input type="checkbox" /></label>
    </div>
  </div>

  <button type="submit">Submit</button>
</div>

<script>
  function toggleSection(header) {
    const content = header.nextElementSibling;
    content.style.display = content.style.display === 'none' ? 'block' : 'none';
    const icon = header.querySelector('.icon');
    icon.textContent = content.style.display === 'none' ? '\u25BC' : '\u25B2';
  }
</script>
